<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NADI Settings</title>
<style>
:root {
  --bg: #0b0b0d; --rail: #0b0b0d; --card: #141418; --card2: #1b1b20; --hover: #1f1f25; --line: #18181c;
  --text: #f2f2f5; --dim: #9a9aa4; --faint: #6d6d75; --accent: #5ac88c; --green: #5ac88c; --amber: #e8b04a; --red: #e87a7a;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.45 "Segoe UI Variable Text", "Segoe UI", sans-serif; user-select: none; }
body { display: flex; overflow: hidden; }
::-webkit-scrollbar { width: 10px; } ::-webkit-scrollbar-thumb { background: #26262c; border-radius: 6px; border: 3px solid var(--bg); }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; display: block; }
svg.s { width: 15px; height: 15px; }
/* the rail: an icon a page; the page you are on marked in the theme colour */
#rail { width: 64px; flex: none; background: var(--rail); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 0; }
#rail .logo { width: 28px; height: 28px; margin-bottom: 12px; }
#rail button { all: unset; position: relative; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; color: var(--dim); }
#rail button:hover { background: var(--hover); color: var(--text); }
#rail button.on { color: var(--accent); }
#rail button.on::before { content: ""; position: absolute; left: -12px; top: 12px; width: 3px; height: 16px; border-radius: 2px; background: var(--accent); }
#rail .gap { flex: 1; }
main { flex: 1; overflow-y: auto; padding: 22px 26px 60px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; }
.card { background: var(--card); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.k { font-size: 11px; font-weight: 600; color: var(--faint); letter-spacing: .02em; }
.row { display: flex; align-items: center; gap: 10px; min-height: 30px; }
.grow { flex: 1; min-width: 0; }
.dim { color: var(--dim); } .faint { color: var(--faint); }
.small { font-size: 11px; }
.name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sub { color: var(--faint); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* picture tiles: a choice among a few, each its little picture */
.tiles { display: grid; gap: 8px; }
.tile { all: unset; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 9px 6px 8px; border-radius: 10px; background: var(--card2); color: var(--dim); font-size: 11px; text-align: center; }
.tile:hover { background: var(--hover); color: var(--text); }
.tile.on { background: #24242a; color: var(--text); box-shadow: inset 0 0 0 1.5px var(--accent); }
.tile svg { display: block; }
/* toggle groups keep their track, the one chosen filled */
.seg { display: inline-flex; background: var(--card2); border-radius: 10px; padding: 3px; gap: 2px; flex: none; }
.seg button { all: unset; padding: 4px 11px; border-radius: 8px; color: var(--dim); font-size: 12px; }
.seg button:hover { color: var(--text); background: var(--hover); }
.seg button.on { background: var(--text); color: #000; font-weight: 600; }
/* ghost buttons: no ground until the mouse is on one */
.gh { all: unset; display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 9px; font-size: 12px; font-weight: 600; color: var(--text); white-space: nowrap; flex: none; }
.gh:hover { background: var(--hover); }
.gh.acc { color: var(--accent); }
.gh.no { color: var(--red); }
.gh[disabled] { opacity: .45; pointer-events: none; }
.switch { position: relative; width: 34px; height: 20px; border-radius: 10px; background: #2a2a30; flex: none; transition: background .2s; }
.switch::after { content: ""; position: absolute; left: 3px; top: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .25s cubic-bezier(.3, 1.6, .5, 1); }
.switch.on { background: var(--accent); }
.switch.on::after { transform: translateX(14px); }
input[type=text], input[type=number], select { all: unset; background: var(--card2); padding: 6px 10px; border-radius: 9px; min-width: 150px; color: var(--text); font-size: 12px; }
select option { background: #1b1b20; }
input[type=range] { accent-color: var(--accent); flex: 1; min-width: 80px; }
.swatches { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.swatch { all: unset; width: 22px; height: 22px; border-radius: 11px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
.swatch.on { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px #f2f2f5; }
.swatch-pick { width: 24px; height: 24px; border: none; padding: 0; background: none; }
.swatch.pair { width: 28px; height: 28px; border-radius: 14px; }
.wells { display: flex; gap: 6px; padding: 3px; border-radius: 12px; }
.wells.on { box-shadow: 0 0 0 2px #f2f2f5; }
.well { position: relative; width: 28px; height: 28px; border-radius: 9px; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.18); display: grid; place-items: center; cursor: pointer; }
.well span { width: 18px; height: 18px; border-radius: 5px; }
.well input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
/* plugins */
.search { display: flex; align-items: center; gap: 8px; flex: 1; height: 32px; padding: 0 12px; border-radius: 10px; background: var(--card2); color: var(--faint); }
.search input { all: unset; flex: 1; color: var(--text); font-size: 12px; }
.chips { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.chip.on { background: #24242a; box-shadow: inset 0 0 0 1.5px var(--accent); }
.chip .n { color: var(--faint); font-weight: 400; }
.dot { width: 14px; height: 14px; border-radius: 7px; flex: none; }
.plugs { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.pc { background: var(--card); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; transition: background .15s, box-shadow .15s; }
.pc:hover { background: #18181d; box-shadow: inset 0 0 0 1.5px #2e2e36; }
.pc .foot { display: flex; align-items: flex-end; gap: 8px; }
.pc .open { color: var(--faint); flex: none; transition: color .15s, transform .15s; }
.pc:hover .open { color: var(--text); transform: translateX(2px); }
.av { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-weight: 700; font-size: 15px; flex: none; }
.av.big { width: 46px; height: 46px; border-radius: 12px; font-size: 19px; }
.desc { color: var(--dim); font-size: 11.5px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.perm { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 7px; background: var(--card2); font-size: 10.5px; color: var(--dim); }
.tag i { width: 6px; height: 6px; border-radius: 3px; background: var(--accent); }
.tag.warn { color: var(--amber); }
.note { padding: 9px 12px; border-radius: 10px; background: var(--card2); color: var(--dim); font-size: 12px; }
.note.bad { color: var(--red); background: rgba(232, 122, 122, .1); }
.empty { color: var(--faint); padding: 18px 4px; }
.spin { width: 13px; height: 13px; border-radius: 50%; border: 2px solid #333; border-top-color: var(--accent); animation: s .8s linear infinite; flex: none; }
@keyframes s { to { transform: rotate(360deg); } }
.wtile { all: unset; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px; border-radius: 10px; background: var(--card2); color: var(--dim); font-size: 11px; min-width: 110px; }
.wtile:hover { background: var(--hover); }
.wtile.on { color: var(--text); }
/* a sheet over the page */
#sheet { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; }
#sheet.on { display: flex; }
#sheet .box { width: 400px; background: var(--card); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 0 0 1px #24242a; }
.tip { position: fixed; pointer-events: none; background: #26262c; color: var(--text); padding: 7px 10px; border-radius: 9px; font-size: 12px; max-width: 320px; opacity: 0; transition: opacity .15s; z-index: 9; white-space: pre-wrap; }
.hint { text-decoration: underline dotted; text-decoration-color: var(--dim); text-underline-offset: 3px; cursor: help; flex: 0 1 auto; margin-right: auto; }
/* the Performance page */
.ptiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.ptile { background: var(--card); border-radius: 14px; padding: 12px 12px 6px; display: flex; flex-direction: column; gap: 6px; overflow: hidden; }
.ptile .th { display: flex; align-items: center; gap: 6px; color: var(--dim); }
.ptile .tv { font-size: 22px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
.ptile .tu { font-size: 12px; font-weight: 600; align-self: flex-end; margin-bottom: 4px; }
.ptile svg.spark { width: 100%; height: 44px; display: block; }
.prow { display: flex; align-items: center; gap: 10px; font-size: 12.5px; min-height: 26px; }
.prow .av { width: 24px; height: 24px; border-radius: 7px; font-size: 12px; }
.prow .pn { width: 130px; font-weight: 600; white-space: nowrap; overflow: hidden; display: flex; align-items: center; gap: 6px; }
.pbar { flex: 1; height: 6px; border-radius: 3px; background: var(--card2); display: flex; overflow: hidden; }
.pbar i { display: block; height: 100%; }
.pv { width: 64px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.pe { width: 40px; text-align: right; font-variant-numeric: tabular-nums; color: var(--faint); }
.hotdot { width: 6px; height: 6px; border-radius: 3px; background: var(--amber); flex: none; }
.legend { display: flex; align-items: center; gap: 4px; margin-left: auto; }
.legend i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-left: 8px; }
/* (the page, before its first numbers: its own shape, shimmering; each graph's line drawing itself in its colour) */
.skel { border-radius: 5px; background: linear-gradient(90deg, var(--card2) 0%, rgba(255,255,255,.09) 50%, var(--card2) 100%); background-size: 200% 100%; animation: shimmer 1.3s ease-in-out infinite; }
@keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
.ptile svg.draw path { stroke-dasharray: 420; stroke-dashoffset: 420; animation: drawline 1.8s ease-in-out infinite; }
@keyframes drawline { 0% { stroke-dashoffset: 420; opacity: 1; } 70% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
</style>
</head>
<body>
<div id="rail"></div>
<main id="main"></main>
<div id="sheet"><div class="box" id="sheetbox"></div></div>
<div class="tip" id="tip"></div>
<script>
"use strict";
const LOGO = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAYAAACqaXHeAAABjklEQVR42u2bP06EQBSHOcFibIyJCbGyXAsLC221k2obE8MBjNnOAxhLL+ApvIAHsJsjcIQ9wnPeBiJuwHFYjCzvI/l18P58zAzM5L0kibxms73Ma+n15uW85J/lqlg0piz5q8sbL0aS8G+AFEMmnnuVO5D4pjTmfJvE02poyY5Lc0j7JO8mkHxzWqQxya8mlHytVRDCBN983EiYyJwPrgk/rfZiRHkbgNIQgLLtJ0eMqWgCcAYBuOa/vRhVllSbCKsAllY+fd2fRKPz/2sdMJz8WgAAAAAAAIChtH94IPPiSs7ub9Y6vphvbVNt1PbUtvoYJYCj0xNZvD/L7cfLN10+3fW2qc9u2lMf6mtUAPSttCVf6/xxEW1Tn+myp76GGgmDANCh2RVsrZiA9d6QPfU5GgDXrw/BgGPWA703ZE99AgAAAAAAAAAAAAAAAAAAYDPEdpgDEY7EOBQFAAAAAAAA9ABgvkDCfImM+SIp22Vy5gslKZWlWJpyeRomaJmhaYq2ORonaZ2ledpm+/wnzoRKik7vJtwAAAAASUVORK5CYII=";
// (the rail's pictures, 24 box)
const ICONS = {
  plugins: "M9 3v5M15 3v5M6 8h12v3a6 6 0 0 1-12 0zM12 17v4",
  perf: "M4 16.5a8 8 0 1 1 16 0M12 16.5l4-5",
  download: "M12 4v11M7 10l5 5 5-5M5 20h14",
  check: "M5 12.5l4.5 4.5L19 7.5",
  cpu: "M7 7h10v10H7zM4 10h3M4 14h3M17 10h3M17 14h3M10 4v3M14 4v3M10 17v3M14 17v3",
  mem: "M4 8h16v8H4zM8 8v8M12 8v8M16 8v8",
  drawing: "M4 18l4-6 4 3 4-7 4 4",
  brush: "M14 4l6 6-8 8H6v-6z",
  gather: "M5 12h14M12 5l7 7-7 7",
  run: "M8 5l11 7-11 7z",
  pause: "M9 6v12M15 6v12",
  play: "M8 5l11 7-11 7z",
  look: "M12 3.5a8.5 8.5 0 1 0 0 17c1.4 0 2-1 1.6-2.1-.4-1.1.3-2.2 1.5-2.2h1.7a3.2 3.2 0 0 0 3.3-3.3C20 7 16.5 3.5 12 3.5zM7.5 12h.01M10 8h.01M14.5 8h.01",
  frame: "M3 5.5A2.5 2.5 0 0 1 5.5 3h13A2.5 2.5 0 0 1 21 5.5v10a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 15.5zM9 3v3h6V3M8 21h8",
  about: "M12 3.5a8.5 8.5 0 1 0 0 17 8.5 8.5 0 0 0 0-17zM12 11v5.5M12 7.5v.5",
  exit: "M12 3v8M6.4 6.4a8 8 0 1 0 11.2 0",
  back: "M15 6l-6 6 6 6",
  plus: "M12 5v14M5 12h14",
  search: "M11 5a6 6 0 1 0 0 12 6 6 0 0 0 0-12zM16 16l4 4",
  refresh: "M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5",
  link: "M14 4h6v6M20 4l-9 9M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4",
  net: "M12 3.5a8.5 8.5 0 1 0 0 17 8.5 8.5 0 0 0 0-17zM3.5 12h17M12 3.5c2.5 2.6 2.5 14.4 0 17M12 3.5c-2.5 2.6-2.5 14.4 0 17",
  shield: "M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z",
  taskbar: "M3 15h18v5H3zM6 17.5h2",
  win: "M4 5l7-1v7H4zM13 4l7-1v8h-7zM4 13h7v7l-7-1zM13 13h7v8l-7-1z",
  power: "M12 3v8M6.4 6.4a8 8 0 1 0 11.2 0",
  moon: "M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10z",
  bell: "M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15zM10 20.5a2.2 2.2 0 0 0 4 0",
  folder: "M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z",
  grid: "M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z",
};
const PAGES = [["plugins", "Plugins"], ["look", "Look"], ["perf", "Performance"]];
const DEFAULT_REPO = "Llyme/nadi-plugins";
let S = { plugins: [], config: {}, widgets: [], repos: {}, busy: {}, errors: {} };
const store = { get(k) { try { return localStorage.getItem(k); } catch (_) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (_) {} } };
let page = store.get("page") || "plugins";
// (the frame's settings are on the Look page now)
if (page === "frame") page = "look";
if (!["plugins", "look", "perf", "about"].includes(page)) page = "plugins";
// (on the plugins page: the list, a plugin's own page, or a source's)
let view = { kind: "list" };
let filter = "all", source = "all", query = "";
let adding = null;

const send = (cmd, o = {}) => window.chrome.webview.postMessage(JSON.stringify({ cmd, ...o }));
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const icon = (name, cls) => { const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("class", "i" + (cls ? " " + cls : "")); const p = document.createElementNS("http://www.w3.org/2000/svg", "path"); p.setAttribute("d", ICONS[name] || name); s.append(p); return s; };
const pic = (html, w, h) => { const d = el("div"); d.innerHTML = `<svg width="${w}" height="${h}" viewBox="0 0 64 40">${html}</svg>`; return d.firstChild; };
// (a tip: beside it (`side`: "right", the rail's), else under it, or over it where there is no room under; always inside the window)
function tipOn(node, text, side) {
  const t = document.getElementById("tip");
  node.addEventListener("mouseenter", () => {
    t.textContent = text; t.style.opacity = 1;
    const r = node.getBoundingClientRect(), tw = t.offsetWidth, th = t.offsetHeight;
    let x, y;
    if (side === "right") { x = r.right + 8; y = r.top + r.height / 2 - th / 2; }
    else { x = r.left; y = r.bottom + 6; if (y + th > innerHeight - 6) y = r.top - th - 6; }
    t.style.left = Math.max(6, Math.min(x, innerWidth - tw - 6)) + "px";
    t.style.top = Math.max(6, Math.min(y, innerHeight - th - 6)) + "px";
  });
  node.addEventListener("mouseleave", () => t.style.opacity = 0);
}
function seg(options, value, onPick) {
  const s = el("div", "seg");
  for (const [v, label] of options) { const b = el("button", v === value ? "on" : "", label); b.onclick = () => onPick(v); s.append(b); }
  return s;
}
function sw(on, onFlip) { const s = el("div", "switch" + (on ? " on" : "")); s.onclick = e => { e.stopPropagation(); onFlip(!on); }; return s; }
function gh(text, cls, onClick, ico) { const b = el("button", "gh" + (cls ? " " + cls : "")); if (ico) b.append(icon(ico, "s")); if (text) b.append(document.createTextNode(text)); b.onclick = e => { e.stopPropagation(); onClick(); }; return b; }
function tiles(cols, items, value, onPick) {
  const t = el("div", "tiles"); t.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  for (const [v, label, art] of items) { const b = el("button", "tile" + (v === value ? " on" : "")); b.append(pic(art, 56, 35), document.createTextNode(label)); b.onclick = () => onPick(v); t.append(b); }
  return t;
}
function card(name, ...kids) { const c = el("div", "card"); if (name) c.append(el("div", "k", name)); c.append(...kids); return c; }
// (a row whose words say more in a tip: underlined with dots, so it shows there is more)
function hintRow(label, tip, control, ico) { const r = row(label, control, ico); const l = r.querySelector("span.grow"); l.classList.add("hint"); tipOn(l, tip); return r; }
function row(label, control, ico) { const r = el("div", "row"); if (ico) { const i = icon(ico, "s"); i.style.color = "var(--dim)"; r.append(i); } r.append(el("span", "grow", label), control); return r; }
// (a plugin's own colour, from its name: its picture is its first letter on it)
const HUES = ["#d97757", "#e8b04a", "#5ac88c", "#3fb6c6", "#4f8ff0", "#a77bf3", "#e86a9a"];
function avatar(name, big) {
  let h = 0; for (const c of name || "?") h = (h * 31 + c.charCodeAt(0)) >>> 0;
  const col = HUES[h % HUES.length];
  const a = el("div", "av" + (big ? " big" : ""), (name || "?").trim().charAt(0).toUpperCase());
  a.style.color = col; a.style.background = col + "22";
  return a;
}

function rail() {
  const r = document.getElementById("rail");
  r.replaceChildren();
  const logo = el("img", "logo"); logo.src = LOGO; logo.alt = ""; r.append(logo);
  const b = (id, label, ico, onClick) => { const x = el("button", page === id ? "on" : ""); x.append(icon(ico)); tipOn(x, label, "right"); x.onclick = onClick || (() => { page = id; view = { kind: "list" }; store.set("page", id); draw(); }); r.append(x); };
  for (const [id, label] of PAGES) b(id, label, id);
  r.append(el("div", "gap"));
  b("about", "About", "about");
  // (quits NADI: with the taskbar hidden, its tray icon is not there to)
  b("exit", "Exit", "exit", () => send("exit"));
}

function draw() {
  rail();
  const m = document.getElementById("main");
  const keep = m.scrollTop;
  const focus = document.activeElement && document.activeElement.dataset.keep;
  m.replaceChildren();
  // (the Performance page: NADI measures what it costs only while it is open)
  perfWatch(page === "perf");
  ({ plugins: pagePlugins, look: pageLookAll, perf: pagePerf, about: pageAbout })[page](m);
  m.scrollTop = keep;
  if (focus) { const f = m.querySelector(`[data-keep="${focus}"]`); if (f) { f.focus(); f.setSelectionRange(f.value.length, f.value.length); } }
  drawSheet();
}

// -------------------------------------------------------------------------------------------------------------- plugins
function verLess(a, b) {
  const pa = String(a || "").replace(/^v/, "").split(/[.-]/).map(Number), pb = String(b || "").replace(/^v/, "").split(/[.-]/).map(Number);
  for (let i = 0; i < Math.max(pa.length, pb.length); i++) { const x = pa[i] || 0, y = pb[i] || 0; if (x !== y) return x < y; }
  return false;
}
function repos() { const r = Object.keys(S.repos); if (!r.includes(DEFAULT_REPO)) r.unshift(DEFAULT_REPO); return r; }
// (every plugin: the ones you have, and every one your sources offer; one entry each)
function catalog() {
  const out = [];
  const offer = new Map();
  for (const repo of repos()) for (const f of (S.repos[repo] && S.repos[repo].plugins) || []) if (!f.problem && !offer.has(f.id)) offer.set(f.id, { repo, f });

  };
  const cpu = col(0), mem = col(1), fr = col(2);
  const mx = a => a.length ? Math.max(...a) : 0, mn = a => a.length ? Math.min(...a) : 0;
  const accent = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#5ac88c";
  tiles.append(
    tile("cpu", P.now[0] < 10 ? P.now[0].toFixed(2) : P.now[0].toFixed(1), "%", cpu, accent, "Processor: NADI's share of the whole PC", 0, Math.max(1, mx(cpu) * 1.25)),
    tile("mem", String(Math.round(P.now[1])), "MB", mem, "#b57de6", "Memory: NADI's own", mn(mem) * 0.9, Math.max(mx(mem) * 1.05, mn(mem) * 0.9 + 1)),
    tile("drawing", P.now[2].toFixed(1), "ms/s", fr, "#4f8ff0", "Drawing: how long NADI spent on its widgets each second", 0, Math.max(5, mx(fr) * 1.25)));
  m.append(tiles);
  const blue = "#4f8ff0", purple = "#b57de6";
  // (each plugin: its time over the last minute, gathering (blue) and running (purple); its updates)
  const plugins = P.plugins || [];
  if (plugins.length) {
    const c = el("div", "card");
    const head = el("div", "row"); const hi = icon("plugins", "s"); hi.style.color = "var(--dim)";
    const legend = el("span", "legend");
    const lg = (color, ico, tip) => { const i = el("i"); i.style.background = color; const p = icon(ico, "s"); p.style.color = "var(--faint)"; p.style.width = "12px"; p.style.height = "12px"; const w = el("span"); w.style.display = "inline-flex"; w.style.alignItems = "center"; w.style.gap = "4px"; w.append(i, p); tipOn(w, tip); return w; };
    legend.append(lg(blue, "gather", "Gathering what it is told"), lg(purple, "run", "Running its code"));
    head.append(hi, legend); c.append(head);
    const top = Math.max(0.001, ...plugins.map(p => p.gather + p.run));
    for (const p of plugins) {
      const r = el("div", "prow");
      const a = avatar(p.shared ? "~" : p.name);
      const n = el("span", "pn", p.name);
      if (p.shared) tipOn(n, "Gathered once for every plugin that asks");
      if (p.hot) { const d = el("span", "hotdot"); tipOn(d, "Busy: more than 5% of a core this last minute"); n.append(d); }
      const b = el("div", "pbar");
      const g = el("i"); g.style.width = (p.gather / top * 100) + "%"; g.style.background = blue;
      const u = el("i"); u.style.width = (p.run / top * 100) + "%"; u.style.background = purple;
      b.append(g, u);
      const v = el("span", "pv", Math.round(p.gather + p.run) + " ms");
      tipOn(v, `A minute: ${Math.round(p.gather)} ms gathering, ${Math.round(p.run)} ms running`);
      const e = el("span", "pe", String(p.events)); tipOn(e, "Updates a minute");
      r.append(a, n, b, v, e); c.append(r);
    }
    m.append(c);
  }
  // (each widget: how long it took to draw over the last minute, and how many times)
  const widgets = P.widgets || [];
  if (widgets.length) {
    const c = el("div", "card");
    const head = el("div", "row"); const hi = icon("brush", "s"); hi.style.color = "var(--dim)"; head.append(hi); c.append(head);
    const top = Math.max(0.001, ...widgets.map(w => w.ms));
    for (const w of widgets) {
      const r = el("div", "prow");
      const b = el("div", "pbar"); const i = el("i"); i.style.width = (w.ms / top * 100) + "%"; i.style.background = blue; b.append(i);
      const v = el("span", "pv", (w.ms < 10 ? w.ms.toFixed(1) : Math.round(w.ms)) + " ms"); tipOn(v, "Drawing it, a minute");
      const e = el("span", "pe", String(w.times)); tipOn(e, "Times drawn a minute");
      r.append(avatar(w.name), el("span", "pn", w.name), b, v, e); c.append(r);
    }
    m.append(c);
  }
}

// ----------------------------------------------------------------------------------------------------------------- look
function pageLook(m) {
  const c = S.config;
  const set = patch => send("config", { patch });
  // (the theme: a pair, the first colour for what is yours and now, the second for what waits for you; each a circle split across,
  // and two wells for a pair of one's own)
  const theme = (c.theme || "#5ac88c").toLowerCase(), theme2 = (c.theme2 || "#e8b04a").toLowerCase();
  const pairs = [["#5ac88c", "#e8b04a", "Mint and Amber"], ["#3fb6c6", "#e8806a", "Teal and Coral"], ["#4f8ff0", "#e8c34a", "Blue and Gold"], ["#a77bf3", "#f0a070", "Violet and Peach"], ["#e86a9a", "#5ac8a0", "Pink and Mint"], ["#d97757", "#5ab0e8", "Clay and Sky"], ["#e8b04a", "#a77bf3", "Amber and Violet"], ["#f2f2f5", "#e8b04a", "White and Amber"]];
  const sws = el("div", "swatches");
  for (const [a, b, name] of pairs) { const d = el("button", "swatch pair" + (a === theme && b === theme2 ? " on" : "")); d.style.background = `linear-gradient(135deg, ${a} 50%, ${b} 50%)`; tipOn(d, name); d.onclick = () => set({ theme: a, theme2: b }); sws.append(d); }
  const wells = el("div", "wells");
  const well = (val, key, tip) => { const w = el("label", "well"); const pick = el("input"); pick.type = "color"; pick.value = val; pick.onchange = () => set({ [key]: pick.value }); const dot = el("span"); dot.style.background = val; w.append(dot, pick); tipOn(w, tip); return w; };
  wells.append(well(theme, "theme", "Yours and Now"), well(theme2, "theme2", "Waiting for You"));
  const own = !pairs.some(([a, b]) => a === theme && b === theme2);
  if (own) { wells.classList.add("on"); }
  sws.append(wells);
  // (a slider, a picture at each end, and its value after it, as it is moved)
  const slider = (min, max, step, value, put, lo, hi, fmt) => {
    const r = el("div", "row");
    const s = el("input"); s.type = "range"; s.min = min; s.max = max; s.step = step; s.value = value;
    const v = el("span", "sub", fmt(Number(value))); v.style.width = "40px"; v.style.textAlign = "right"; v.style.color = "var(--dim)";
    s.oninput = () => v.textContent = fmt(Number(s.value));
    s.onchange = () => put(Number(s.value));
    r.append(lo, s, hi, v); return r;
  };
  const liquidLo = pic(`<rect x="0" y="0" width="64" height="8" fill="#3a3a42"/><rect x="10" y="6" width="18" height="16" rx="7" fill="#3a3a42"/><rect x="36" y="6" width="18" height="16" rx="7" fill="#3a3a42"/>`, 40, 25);
  const liquidHi = pic(`<rect x="0" y="0" width="64" height="8" fill="${c.theme || "#5ac88c"}"/><path d="M6 6h52v6a10 10 0 0 1-10 10H16A10 10 0 0 1 6 12z" fill="${c.theme || "#5ac88c"}"/>`, 40, 25);
  const a = el("span", "faint", "A"), A = el("span", "faint", "A"); a.style.fontSize = "10px"; A.style.fontSize = "17px";
  const grid = el("div", "grid2");
  grid.append(card("Theme", sws), card("Liquid", slider(0, 100, 1, c.liquid ?? 50, v => set({ liquid: v }), liquidLo, liquidHi, v => v < 1 ? "Off" : String(Math.round(v))), el("div", "k", "Size"), slider(0.75, 1.5, 0.05, c.scale || 1, v => set({ scale: v }), a, A, v => Math.round(v * 100) + "%")));
  m.append(grid);
}

// (the look and the frame together, in one grid: there is not much of either)
function pageLookAll(m) {
  pageLook(m);
  const grid = m.querySelector(".grid2");
  const t = el("div");
  pageFrame(t);
  for (const x of [...t.children]) {
    if (grid && x.classList.contains("grid2")) grid.append(...x.children); else m.append(x);
  }
}

// ---------------------------------------------------------------------------------------------------------------- frame
const MINI = `<rect x="1" y="1" width="62" height="38" rx="5" fill="none" stroke="#3a3a42" stroke-width="1.5"/>`;
const CUR = (x, y) => `<path d="M${x} ${y}l0 7 2-2 1.5 3 1.5-.6-1.5-3 3 0z" fill="#f2f2f5"/>`;
function pageFrame(m) {
  const c = S.config;
  const set = patch => send("config", { patch });
  const lit = (S.config.theme || "#5ac88c"), grey = "#6d6d75";
  const grid = el("div", "grid2");
  const reveal = c.reveal || "all";
  // (how near an edge the mouse brings them out, shown on a little screen as a soft frame that thick; and how long it rests there first)
  const reachRows = () => {
    const box = el("div"); box.style.display = "flex"; box.style.flexDirection = "column"; box.style.gap = "10px";
    const scr = el("div"); scr.style.cssText = "position:relative;height:96px;border-radius:10px;overflow:hidden;background:linear-gradient(160deg,#13204a,#1c3270)";
    const band = el("div"), edge = el("div");
    const draw = px => { const k = Math.max(2, px) * 0.6; band.style.cssText = `position:absolute;inset:0;box-shadow:inset 0 0 0 ${k}px ${lit}33`; edge.style.cssText = `position:absolute;inset:${k}px;border:1.5px solid ${lit};border-radius:6px`; };
    draw(c.edge_reach ?? 6);
    scr.append(band, edge);
    const slide = (label, min, max, step, value, fmt, put, live) => {
      const r = el("div", "row"); const k = el("span", "grow", label);
      const s = el("input"); s.type = "range"; s.min = min; s.max = max; s.step = step; s.value = value; s.style.width = "150px";
      const v = el("span", "sub", fmt(Number(value))); v.style.width = "44px"; v.style.textAlign = "right"; v.style.color = "var(--dim)";
      s.oninput = () => { v.textContent = fmt(Number(s.value)); live && live(Number(s.value)); };
      s.onchange = () => { put(Number(s.value)); live && live(Number(s.value), true); };
      r.append(k, s, v); return r;
    };
    box.append(scr,
      // (as it is dragged, the band shows on the screen itself too; let go, it fades a moment later)
      slide("Edge Reach", 2, 64, 1, c.edge_reach ?? 6, v => v + " px", v => set({ edge_reach: v }), (v, done) => { draw(v); if (!done) send("reach_preview", { px: v }); }),
      slide("Wait", 0, 1000, 50, c.edge_wait ?? 0, v => v === 0 ? "None" : (v / 1000).toFixed(2).replace(/0$/, "") + " s", v => set({ edge_wait: v })));
    return box;
  };
  grid.append(card("Show Widgets",
    tiles(4, [
      ["all", "Always", `${MINI}<rect x="20" y="1" width="24" height="5" rx="2" fill="${lit}"/><rect x="1" y="14" width="5" height="12" rx="2" fill="${lit}"/><rect x="24" y="34" width="16" height="5" rx="2" fill="${lit}"/>`],
      ["edges", "Any Edge", `${MINI}<rect x="20" y="1" width="24" height="5" rx="2" fill="${grey}"/><rect x="1" y="14" width="5" height="12" rx="2" fill="${grey}"/><rect x="24" y="34" width="16" height="5" rx="2" fill="${grey}"/>${CUR(50, 30)}`],
      ["edge", "Hovered Edge", `${MINI}<rect x="24" y="34" width="16" height="5" rx="2" fill="${grey}"/>${CUR(33, 26)}`],
      ["near", "Near Mouse", `${MINI}<rect x="24" y="34" width="9" height="5" rx="2" fill="${grey}"/><circle cx="29" cy="30" r="9" fill="none" stroke="#3a3a42" stroke-dasharray="2 2"/>${CUR(27, 24)}`],
    ], reveal, v => set({ reveal: v })),
    reachRows(),
    row("Open Widgets On", seg([["hover", "Hover"], ["click", "Click"]], c.open_on || "hover", v => set({ open_on: v }))),
    row("Hold to Show", seg([["none", "None"], ["alt", "Alt"], ["ctrl", "Ctrl"]], c.hold_key || "none", v => set({ hold_key: v })))));
  const twin = (a, b, bar) => `<rect x="1" y="6" width="28" height="18" rx="3" fill="none" stroke="${a}" stroke-width="1.5"/><rect x="35" y="6" width="28" height="18" rx="3" fill="none" stroke="${b}" stroke-width="1.5"/>${bar}`;
  grid.append(card("Monitors",
    tiles(3, [
      ["follow", "Follow Mouse", twin("#3a3a42", lit, `<rect x="44" y="6" width="10" height="3" rx="1.5" fill="${lit}"/>${CUR(48, 15)}`)],
      ["all", "All Monitors", twin(grey, grey, `<rect x="10" y="6" width="10" height="3" rx="1.5" fill="${grey}"/><rect x="44" y="6" width="10" height="3" rx="1.5" fill="${grey}"/>`)],
      ["primary", "Main Monitor", twin(grey, "#3a3a42", `<rect x="10" y="6" width="10" height="3" rx="1.5" fill="${grey}"/><circle cx="15" cy="30" r="1.8" fill="${grey}"/>`)],
    ], c.monitors || "follow", v => set({ monitors: v })),
    el("div", "k", "Auto-Hide"),
    tiles(3, [
      ["never", "Never", `<rect x="8" y="5" width="48" height="28" rx="3" fill="none" stroke="${grey}" stroke-width="1.5"/><rect x="26" y="5" width="12" height="4" rx="2" fill="${grey}"/>`],
      ["fullscreen", "Full Screen", `<rect x="8" y="5" width="48" height="28" rx="3" fill="none" stroke="${grey}" stroke-width="1.5"/><path d="M14 11V9h3M50 11V9h-3M14 27v2h3M50 27v2h-3" stroke="${grey}" stroke-width="1.5" fill="none"/>`],
      ["maximized", "Maximized", `<rect x="8" y="5" width="48" height="28" rx="3" fill="none" stroke="${grey}" stroke-width="1.5"/><rect x="12" y="9" width="40" height="20" rx="2" fill="none" stroke="${grey}" stroke-width="1.5"/>`],
    ], c.auto_hide || "fullscreen", v => set({ auto_hide: v }))));
  grid.append(card("Banners",
    hintRow("Quiet Over Full Screen", "Minor banners wait while a full-screen app or game is in front. Banners that need you still show.", sw(c.quiet_full !== false, on => set({ quiet_full: on })), "bell")));
  grid.append(card("Windows",
    hintRow("Taskbar", "Keep: widgets stay clear of it. Under: widgets stand at the screen's edge, the taskbar under them. Hide: hidden.", seg([["keep", "Keep"], ["under", "Under"], ["hide", "Hide"]], c.taskbar || "keep", v => set({ taskbar: v })), "taskbar"),
    row("Windows Key", seg([["auto", "Auto"], ["launcher", "Launcher"], ["start", "Start"]], c.win_key || "auto", v => set({ win_key: v })), "win"),
    hintRow("Pin From File Explorer", "Adds Pin to NADI Dock and Pin to NADI Apps to the right-click menu of files and folders. On Windows 11, under Show more options.", sw(!!c.explorer_menu, on => set({ explorer_menu: on })), "folder"),
    hintRow("Launcher Shows Widgets", "Opening the launcher brings every widget out, over a game too.", sw(!!c.launcher_reveal, on => set({ launcher_reveal: on })), "grid"),
    row("Start With Windows", sw(!!S.autostart, on => send("autostart", { on })), "power")));
  m.append(grid);
}

// ---------------------------------------------------------------------------------------------------------------- about
function pageAbout(m) {
  const head = el("div", "row"); head.style.marginBottom = "12px";
  const logo = el("img"); logo.src = LOGO; logo.style.width = "40px"; logo.style.height = "40px";
  const g = el("div", "grow"); g.append(el("div", "name", "NADI"), el("div", "sub", S.version || ""));
  head.append(logo, g);
  m.append(head);
  // (a newer NADI: fetched and installed from here, no browser; else up to date, looked for again with a press)
  const u = S.update || { state: "current" };
  const spin = () => el("span", "spin");
  let urow;
  if (u.state === "ready") urow = row(`Version ${u.version} Is Ready`, gh("Update", "acc", () => send("update"), "download"), "download");
  else if (u.state === "fetching") urow = row(`Downloading Version ${u.version}`, spin(), "download");
  else if (u.state === "installing") urow = row(`Installing Version ${u.version}`, spin(), "download");
  else if (u.state === "looking") urow = row("Looking for a New Version", spin(), "refresh");
  else if (u.state === "failed") {
    urow = el("div"); urow.style.display = "flex"; urow.style.flexDirection = "column"; urow.style.gap = "8px";
    urow.append(el("div", "note bad", u.error || "Something went wrong."));
    urow.append(u.version ? row(`Version ${u.version} Is Ready`, gh("Try Again", "acc", () => send("update"), "download"), "download") : row("Look Again", gh(null, "", () => send("update_check"), "refresh"), "refresh"));
  } else {
    const again = gh(null, "", () => send("update_check"), "refresh"); tipOn(again, "Look Again");
    urow = row("Up to Date", again, "check");
  }
  m.append(card(null, urow));
  m.append(card(null, row("Plugins Folder", gh("Open", "", () => send("open", { what: "plugins" }), "folder")), row("Data Folder", gh("Open", "", () => send("open", { what: "data" }), "folder"))));
}

window.chrome.webview.addEventListener("message", e => {
  const msg = e.data;
  if (msg.type === "state") {
    S = Object.assign(S, msg); S.busy = msg.busy || {}; S.errors = msg.errors || {};
    if (S.config && S.config.theme) document.documentElement.style.setProperty("--accent", S.config.theme);
    // (asked to open on a page: a plugin's own, from a widget's menu)
    if (msg.goto) {
      const [kind, id] = String(msg.goto).split(":");
      if (kind === "plugin" && id) { page = "plugins"; view = { kind: "plugin", id }; }
      else if (["plugins", "look", "frame", "about"].includes(kind)) { page = kind === "frame" ? "look" : kind; view = { kind: "list" }; }
      send("goto_done");
    }
    draw();
  }
  // (what NADI costs, once a second while the Performance page is open; paused, kept as it was)
  if (msg.type === "perf") {
    if (perfPaused) return;
    S.perf = msg;
    // (a tip showing: left as it is until the mouse moves off, so the tip stays with what it names)
    if (page === "perf" && document.getElementById("tip").style.opacity !== "1") draw();
  }
});
send("ready");
draw();
</script>
</body>
</html>
