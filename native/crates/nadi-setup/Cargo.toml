[package]
name = "nadi-setup"
version = "1.9.1"
edition = "2021"

# NADI's installer: one exe that carries NADI inside it and puts it in place for this user (no administrator needed).

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
