# The module plugins the app carries (time, ics-calendar), the examples (not part of the app), and the SDK they are written with.
#   cd plugins && cargo build --release --target wasm32-unknown-unknown
#   (or: powershell ./build.ps1: the carried ones into src-tauri/plugins-bundled, the examples into dist/)
[workspace]
members = ["sdk", "audio-meter", "game-clock", "time", "ics-calendar", "busy-meter"]
resolver = "2"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
codegen-units = 1
