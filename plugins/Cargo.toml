# The example plugins that ship with NADI, and the SDK they are written with.
#   cd plugins && cargo build --release --target wasm32-unknown-unknown
#   (or: powershell ./build.ps1, which also copies the .wasm files into src-tauri/plugins-bundled)
[workspace]
members = ["sdk", "audio-meter", "game-clock", "time", "agenda", "busy-meter"]
resolver = "2"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
codegen-units = 1
