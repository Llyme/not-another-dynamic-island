<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NADI</title>
<meta name="description" content="Widgets that live on the edges of your Windows screen. Try them on a pretend PC: hover, open, drag and play with everything.">
<meta name="theme-color" content="#000000">
<meta property="og:title" content="NADI: Not Another Dynamic Island">
<meta property="og:description" content="Widgets on the edges of your Windows screen. Try them on a pretend PC.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* The page is a pretend Windows screen with NADI on it: a wallpaper, desktop icons, windows, a taskbar, and NADI's widgets merged
   into the screen's edges. Everything is drawn here; nothing to scroll (on a phone, the screen shrinks to fit, and the download
   sits under it). */
:root {
  color-scheme: dark;
  --acc: #5ac88c;
  --two: #e8b04a;
  --claude: #e08a5a;
  --red: #e87a7a;
  --teal: #5ac8e6;
  --text: #f2f2f5;
  --dim: #8e8e96;
  --mute: #5c5c64;
  --track: #141519;
  --lit: #1f1f25;
  --spring: cubic-bezier(.3, 1.32, .5, 1);
  --soft: cubic-bezier(.2, .9, .3, 1);
  --tb: 46px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #000; color: var(--text); font-family: Inter, "Segoe UI", system-ui, sans-serif; font-size: 13px; }
body { overflow: hidden; }
body.small { overflow: auto; height: auto; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: default; }
a { color: inherit; }
#wrap { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
#screen { position: absolute; left: 0; top: 0; width: 100vw; height: 100vh; overflow: hidden; transform-origin: 0 0; user-select: none; -webkit-user-select: none; touch-action: none; }
.ic { display: inline-block; flex: none; }
.ic svg { display: block; width: 100%; height: 100%; }
.tab { font-variant-numeric: tabular-nums; }
.out { font-family: Outfit, Inter, sans-serif; }

/* the wallpaper: a soft bloom of blues */
#wall { position: absolute; inset: 0; background:
  radial-gradient(42% 52% at 68% 56%, #8fb6ff 0%, #5d8ff0 22%, transparent 60%),
  radial-gradient(60% 70% at 74% 62%, #2f5fd0 0%, transparent 65%),
  radial-gradient(50% 60% at 30% 90%, #3a2a8a 0%, transparent 70%),
  radial-gradient(70% 80% at 12% 6%, #142456 0%, transparent 70%),
  linear-gradient(160deg, #0b1534, #13275c 55%, #091128); }

/* desktop icons */
#icons { position: absolute; left: 52px; top: 54px; display: flex; flex-direction: column; gap: 6px; z-index: 2; }
.dk { width: 84px; padding: 8px 4px 6px; border-radius: 6px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11.5px; color: #fff; text-shadow: 0 1px 3px #000c; text-align: center; line-height: 1.25; }
.dk:hover { background: #ffffff1a; }
.dk .ib { width: 44px; height: 44px; border-radius: 11px; display: grid; place-items: center; box-shadow: 0 6px 16px #0006; color: #fff; }
.dk .ib .ic { width: 22px; height: 22px; }

/* windows */
#wins { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
.win { position: absolute; pointer-events: auto; display: flex; flex-direction: column; background: #1e1f25f2; border: 1px solid #ffffff16; border-radius: 9px; box-shadow: 0 24px 60px #0009, 0 2px 8px #0005; overflow: hidden; z-index: 10; transition: opacity .18s, transform .22s var(--soft); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); }
.win.gone { opacity: 0; transform: translateY(16px) scale(.96); pointer-events: none; }
.wbar { height: 34px; flex: none; display: flex; align-items: center; padding-left: 12px; gap: 9px; font-size: 12px; color: #d6d6dc; }
.wbar .ic { width: 15px; height: 15px; }
.wbar .sp { flex: 1; }
.wbar button { width: 44px; height: 34px; display: grid; place-items: center; color: #c9c9d1; }
.wbar button .ic { width: 13px; height: 13px; }
.wbar button:hover { background: #ffffff14; }
.wbar button.cl:hover { background: #c42b1c; color: #fff; }
.wbody { flex: 1; min-height: 0; overflow: auto; }
.wbody::-webkit-scrollbar { width: 10px; }
.wbody::-webkit-scrollbar-thumb { background: #ffffff22; border-radius: 5px; border: 3px solid transparent; background-clip: padding-box; }

/* the taskbar */
#taskbar { position: absolute; left: 0; right: 0; bottom: 0; height: var(--tb); z-index: 40; background: #1c1d24e0; border-top: 1px solid #ffffff10; backdrop-filter: blur(30px) saturate(1.4); -webkit-backdrop-filter: blur(30px) saturate(1.4); display: flex; align-items: center; justify-content: center; gap: 4px; }
.tk { position: relative; width: 40px; height: 40px; border-radius: 6px; display: grid; place-items: center; }
.tk:hover { background: #ffffff12; }
.tk .ib { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; color: #fff; }
.tk .ib .ic { width: 15px; height: 15px; }
.tk::after { content: ""; position: absolute; bottom: 2px; left: 50%; width: 0; height: 3px; border-radius: 2px; background: #9a9aa6; transform: translateX(-50%); transition: width .2s var(--soft); }
.tk.run::after { width: 6px; }
.tk.front::after { width: 16px; background: var(--acc); }
#tray { position: absolute; right: 8px; top: 0; bottom: 0; display: flex; align-items: center; gap: 2px; }
#tray .tt { height: 38px; padding: 0 8px; border-radius: 6px; display: flex; align-items: center; gap: 9px; font-size: 11.5px; color: #e4e4ea; }
#tray .tt:hover { background: #ffffff12; }
#tray .tt .ic { width: 15px; height: 15px; }
#clock { text-align: right; line-height: 1.35; }

/* NADI: each widget a piece of black merged into its edge, with a fillet each side where it meets the edge */
#nadi { position: absolute; inset: 0; z-index: 50; pointer-events: none; }
.w { position: absolute; background: #000; pointer-events: auto; --r: 17px; --f: 9px;
  transition: left .42s var(--spring), top .42s var(--spring), width .42s var(--spring), height .42s var(--spring), border-radius .32s var(--soft), box-shadow .4s; }
.w.open, .w.ban { --r: 26px; --f: 12px; }
.w.sw { transition-duration: .3s, .3s, .3s, .3s, .32s, .4s; }
.w::before, .w::after { content: ""; position: absolute; width: var(--f); height: var(--f); pointer-events: none; transition: width .3s, height .3s; }
.e-top { border-radius: 0 0 var(--r) var(--r); }
.e-top::before { top: 0; left: calc(-1 * var(--f) + .5px); background: radial-gradient(circle at 0 100%, transparent calc(var(--f) - .5px), #000 var(--f)); }
.e-top::after { top: 0; right: calc(-1 * var(--f) + .5px); background: radial-gradient(circle at 100% 100%, transparent calc(var(--f) - .5px), #000 var(--f)); }
.e-bottom { border-radius: var(--r) var(--r) 0 0; }
.e-bottom::before { bottom: 0; left: calc(-1 * var(--f) + .5px); background: radial-gradient(circle at 0 0, transparent calc(var(--f) - .5px), #000 var(--f)); }
.e-bottom::after { bottom: 0; right: calc(-1 * var(--f) + .5px); background: radial-gradient(circle at 100% 0, transparent calc(var(--f) - .5px), #000 var(--f)); }
.e-left { border-radius: 0 var(--r) var(--r) 0; }
.e-left::before { left: 0; top: calc(-1 * var(--f) + .5px); background: radial-gradient(circle at 100% 0, transparent calc(var(--f) - .5px), #000 var(--f)); }
.e-left::after { left: 0; bottom: calc(-1 * var(--f) + .5px); background: radial-gradient(circle at 100% 100%, transparent calc(var(--f) - .5px), #000 var(--f)); }
.e-right { border-radius: var(--r) 0 0 var(--r); }
.e-right::before { right: 0; top: calc(-1 * var(--f) + .5px); background: radial-gradient(circle at 0 0, transparent calc(var(--f) - .5px), #000 var(--f)); }
.e-right::after { right: 0; bottom: calc(-1 * var(--f) + .5px); background: radial-gradient(circle at 0 100%, transparent calc(var(--f) - .5px), #000 var(--f)); }
.w.gone::before, .w.gone::after { width: 0; height: 0; }
.w.drag { border-radius: 999px !important; transition: width .3s var(--spring), height .3s var(--spring), border-radius .2s; box-shadow: 0 14px 34px #000a; z-index: 5; }
.w.drag::before, .w.drag::after { display: none; }
.clip { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; }
.peek { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 14px; white-space: nowrap; font-weight: 600; font-size: 12.5px; transition: opacity .22s .1s; }
.v .peek { flex-direction: column; padding: 10px 0; gap: 7px; }
.w.open .peek, .w.ban .peek, .w.gone .peek { opacity: 0; transition: opacity .1s; }
.body, .bnr { position: absolute; left: 0; top: 0; opacity: 0; pointer-events: none; transition: opacity .12s; }
.e-bottom .body, .e-bottom .bnr { top: auto; bottom: 0; }
.e-right .body, .e-right .bnr { left: auto; right: 0; }
.w.open .body, .w.ban .bnr { opacity: 1; pointer-events: auto; transition: opacity .26s .14s; }
.body { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
#meas { position: absolute; left: -9999px; top: 0; visibility: hidden; }
#meas.h { display: inline-flex; align-items: center; gap: 8px; padding: 0 14px; height: 38px; white-space: nowrap; font-weight: 600; font-size: 12.5px; }
#meas.vv { display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 10px 0; width: 40px; font-weight: 600; font-size: 12.5px; }

/* what goes in them */
.dot { width: 6px; height: 6px; border-radius: 3px; background: var(--acc); flex: none; }
.dot.pulse { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.5); opacity: .55; } }
.bars { display: flex; gap: 2px; align-items: flex-end; height: 13px; }
.bars i { display: block; width: 3px; height: 4px; border-radius: 2px; background: var(--acc); animation: bar .8s ease-in-out infinite alternate; }
.bars i:nth-child(2) { animation-delay: -.5s; animation-duration: .7s; }
.bars i:nth-child(3) { animation-delay: -.2s; animation-duration: .9s; }
.bars.still i { animation: none; height: 4px; background: var(--mute); }
@keyframes bar { to { height: 13px; } }
.mq { max-width: 120px; overflow: hidden; -webkit-mask: linear-gradient(90deg, #000 85%, transparent); mask: linear-gradient(90deg, #000 85%, transparent); }
.mq.fits { -webkit-mask: none; mask: none; }
.mq > span { display: inline-block; }
.mq > span.go { animation: mq var(--d, 6s) ease-in-out infinite alternate; }
@keyframes mq { 0%, 18% { transform: translateX(0); } 82%, 100% { transform: translateX(var(--x)); } }
.burst { color: var(--claude); }
.burst.spin .ic { animation: spin 3s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.flow { display: inline-block; width: 8px; height: 12px; overflow: hidden; -webkit-mask: linear-gradient(transparent, #000 30%, #000 70%, transparent); mask: linear-gradient(transparent, #000 30%, #000 70%, transparent); vertical-align: -1px; flex: none; }
.flow svg { display: block; width: 8px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.flow.dn svg { animation: fdn .7s linear infinite; }
.flow.up svg { animation: fup .7s linear infinite; }
@keyframes fdn { from { transform: translateY(-12px); } to { transform: translateY(-6px); } }
@keyframes fup { from { transform: translateY(-6px); } to { transform: translateY(-12px); } }
.eyes { display: flex; gap: 6px; align-items: center; --ex: 0px; --ey: 0px; }
.v .eyes { flex-direction: column; gap: 5px; }
.eyes i { display: block; width: 6px; height: 13px; border-radius: 3px; background: var(--text); transform: translate(var(--ex), var(--ey)); transition: transform .12s, height .1s; }
.v .eyes i { width: 13px; height: 6px; }
.eyes.blink i { height: 1.5px; }
.v .eyes.blink i { width: 1.5px; height: 6px; }
.eyes.happy i { height: 5px; border-radius: 6px 6px 0 0; }

/* panel parts */
.gb { height: 30px; min-width: 30px; padding: 0 10px; border-radius: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px; font-weight: 600; color: #d6d6dc; }
.gb:hover { background: var(--lit); }
.gb .ic { width: 15px; height: 15px; }
.gb.on { color: var(--acc); }
.sb { height: 32px; padding: 0 16px; border-radius: 16px; font-size: 12.5px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.lab { font-size: 11px; font-weight: 600; color: var(--dim); margin: 2px 2px -4px; }
.mut { color: var(--dim); }
.row { width: 100%; text-align: left; display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 4px 8px; margin: 0 -6px; border-radius: 12px; }
.row.go:hover { background: var(--lit); }
.row .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row .tt { font-weight: 600; font-size: 12.5px; white-space: nowrap; overflow: hidden; }
.row .ts { font-size: 11.5px; color: var(--dim); white-space: nowrap; overflow: hidden; }
.row .rt { font-size: 11.5px; color: var(--dim); white-space: nowrap; }
.row .ic { width: 16px; height: 16px; }
.toggles { display: flex; gap: 4px; padding: 3px; border-radius: 14px; background: var(--track); }
.toggles button { flex: 1; height: 30px; border-radius: 11px; display: flex; align-items: center; justify-content: center; gap: 7px; font-size: 11.5px; font-weight: 600; color: var(--dim); }
.toggles button:hover { background: var(--lit); }
.toggles button.on { background: #24252c; color: var(--text); }
.toggles button.on .ic { color: var(--acc); }
.toggles .ic { width: 16px; height: 16px; }
.bar { height: 5px; border-radius: 3px; background: #1d1e24; overflow: hidden; position: relative; }
.bar > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--c, var(--acc)); overflow: hidden; transition: width .9s linear; }
.bar > i::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, #ffffff48, transparent); animation: shine 2.6s ease-in-out infinite; transform: translateX(-100%); }
@keyframes shine { 60%, 100% { transform: translateX(100%); } }
.card { background: var(--track); border-radius: 18px; padding: 12px; display: flex; gap: 12px; align-items: center; }

/* calendar */
.dayhead { display: flex; align-items: flex-end; justify-content: space-between; padding: 2px 4px 0; }
.dayhead .big { font-family: Outfit, sans-serif; font-size: 40px; font-weight: 600; line-height: .95; letter-spacing: -.5px; }
.dayhead .big small { font-size: 14px; font-weight: 600; color: var(--dim); margin-left: 5px; letter-spacing: 0; }
.dayhead .dr { text-align: right; display: flex; flex-direction: column; gap: 2px; padding-bottom: 3px; }
.dayhead .dr b { font-size: 13px; }
.dayhead .dr span { font-size: 12px; color: var(--dim); }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.week button { height: 54px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
.week button:hover { background: var(--lit); }
.week small { font-size: 10px; color: var(--dim); font-weight: 600; }
.week b { font-size: 14px; font-family: Outfit, sans-serif; font-weight: 600; width: 26px; height: 26px; border-radius: 13px; display: grid; place-items: center; }
.week .today b { color: var(--acc); }
.week .on b { background: var(--acc); color: #04130b; }
.week .ds { display: flex; gap: 2px; height: 4px; }
.week .ds i { width: 4px; height: 4px; border-radius: 2px; background: var(--acc); }
.tl { display: flex; flex-direction: column; gap: 2px; }
.tl .ev { display: flex; gap: 10px; align-items: stretch; padding: 6px 6px; border-radius: 12px; }
.tl .ev.past { opacity: .45; }
.tl .tm { width: 54px; font-size: 11.5px; color: var(--dim); padding-top: 1px; }
.tl .cb { width: 3px; border-radius: 2px; background: var(--acc); }
.tl .now { height: 0; border-top: 1.5px solid var(--red); margin: 2px 6px 2px 58px; position: relative; }
.tl .now::before { content: ""; position: absolute; left: -4px; top: -4.5px; width: 7px; height: 7px; border-radius: 4px; background: var(--red); }

/* the launcher */
#launch { position: absolute; z-index: 60; width: 560px; background: #000; border-radius: 26px; padding: 14px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 24px 70px #000a; opacity: 0; transform: translateY(18px) scale(.92); pointer-events: none; transition: opacity .18s, transform .38s var(--spring); }
#launch.show { opacity: 1; transform: none; pointer-events: auto; }
.search { height: 42px; border-radius: 21px; background: var(--track); display: flex; align-items: center; gap: 10px; padding: 0 6px 0 16px; }
.search .ic { width: 16px; height: 16px; color: var(--dim); }
.search input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--text); font: inherit; font-size: 13.5px; caret-color: var(--acc); }
.search input::placeholder { color: var(--mute); }
.pins { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
.pin { height: 84px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-size: 11.5px; color: #d6d6dc; }
.pin:hover { background: var(--lit); }
.pin .ib, .row .ib { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; color: #fff; flex: none; }
.pin .ib .ic { width: 20px; height: 20px; }
.row .ib { width: 30px; height: 30px; border-radius: 8px; }
.row .ib .ic { width: 15px; height: 15px; }
.foot { display: flex; justify-content: flex-end; gap: 2px; border-top: 1px solid #ffffff10; padding-top: 10px; }
.foot .gb { width: 38px; height: 38px; border-radius: 19px; padding: 0; }
.foot .gb .ic { width: 17px; height: 17px; }
.list { display: flex; flex-direction: column; max-height: 340px; overflow: auto; }
.list .row { margin: 0; }

/* menu, tip, modal, screens over all */
#menu { position: absolute; z-index: 70; min-width: 190px; background: #000; border-radius: 16px; padding: 6px; box-shadow: 0 16px 44px #000b; display: none; flex-direction: column; transform-origin: top left; animation: grow .22s var(--spring); }
#menu.show { display: flex; }
@keyframes grow { from { transform: scale(.85); opacity: 0; } }
#menu button { height: 34px; padding: 0 12px; border-radius: 11px; display: flex; align-items: center; gap: 10px; font-size: 12.5px; text-align: left; }
#menu button:hover { background: var(--lit); }
#menu .ic { width: 16px; height: 16px; color: var(--dim); }
#tip { position: absolute; z-index: 100; background: #000; color: var(--text); border-radius: 10px; padding: 7px 11px; font-size: 12px; white-space: pre-line; max-width: 260px; line-height: 1.4; box-shadow: 0 8px 24px #0009; opacity: 0; transform: translateY(4px); transition: opacity .14s, transform .2s var(--soft); pointer-events: none; }
#tip.show { opacity: 1; transform: none; }
#modal { position: absolute; inset: 0; z-index: 80; display: none; place-items: center; }
#modal.show { display: grid; }
#modal .dim { position: absolute; inset: 0; background: #0008; animation: fade .25s; }
@keyframes fade { from { opacity: 0; } }
#modal .card2 { position: relative; width: 300px; background: #000; border-radius: 26px; padding: 22px 20px 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; box-shadow: 0 20px 60px #000a; animation: pop .34s var(--spring); }
@keyframes pop { from { transform: scale(.6); opacity: 0; } }
#modal .mi { width: 52px; height: 52px; border-radius: 26px; display: grid; place-items: center; background: #e87a7a26; color: var(--red); margin-bottom: 4px; }
#modal .mi .ic { width: 22px; height: 22px; }
#modal .mt { font-size: 15px; font-weight: 600; font-family: Outfit, sans-serif; }
#modal .ms { font-size: 12px; color: var(--dim); text-align: center; line-height: 1.5; }
#modal .mb { display: flex; gap: 8px; width: 100%; margin-top: 10px; }
#modal .mb button { flex: 1; height: 38px; border-radius: 19px; font-size: 12.5px; font-weight: 600; color: #c9c9d1; }
#modal .mb button:hover { background: var(--lit); }
#modal .mb button.red { background: var(--red); color: #1a0606; }
#modal .mb button.red:hover { background: #f08c8c; }
#over { position: absolute; inset: 0; z-index: 90; display: none; }
#over.show { display: block; }
#over.black { background: #000; animation: fade .6s; }
#over.lock { animation: fade .4s; }
#over .lk { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding-top: 16vh; color: #fff; text-shadow: 0 2px 20px #0006; }
#over .lk .big { font-family: Outfit, sans-serif; font-size: 96px; font-weight: 600; line-height: 1; }
#over .lk .sm { font-size: 18px; margin-top: 10px; }
#over .lk .hint { position: absolute; bottom: 8vh; font-size: 13px; opacity: .7; }
#over .off { position: absolute; inset: 0; display: grid; place-items: center; }
#over .off button { width: 64px; height: 64px; border-radius: 32px; display: grid; place-items: center; color: #444; }
#over .off button:hover { color: var(--acc); background: #ffffff08; }
#over .off .ic { width: 28px; height: 28px; }
#over.leaving { animation: up .5s var(--soft) forwards; }
@keyframes up { to { transform: translateY(-100%); } }
#over.waking { animation: fadeout .7s forwards; }
@keyframes fadeout { to { opacity: 0; } }

/* the apps' own windows */
.readme { padding: 14px 18px 18px; font-size: 13px; line-height: 1.65; color: #e4e4ea; user-select: text; -webkit-user-select: text; }
.readme h1 { font-family: Outfit, sans-serif; font-size: 22px; font-weight: 600; margin: 2px 0 2px; }
.readme .sub { color: var(--dim); margin-bottom: 12px; }
.readme ul { margin: 0 0 14px; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 7px; }
.readme li { display: flex; gap: 10px; align-items: flex-start; }
.readme li .ic { width: 16px; height: 16px; color: var(--acc); margin-top: 3px; }
.readme .get { display: flex; gap: 8px; margin-top: 4px; }
.readme .get a { text-decoration: none; }
.sb.acc { background: var(--acc); color: #04130b; }
.sb.acc:hover { background: #6fd89e; }
.sb.gh2 { color: #d6d6dc; }
.sb.gh2:hover { background: var(--lit); }
.player { padding: 8px 20px 18px; display: flex; flex-direction: column; gap: 14px; }
.cover { border-radius: 12px; flex: none; box-shadow: 0 10px 30px #0007; }
.ctl { display: flex; align-items: center; justify-content: center; gap: 10px; }
.ctl .gb { width: 40px; height: 40px; padding: 0; border-radius: 20px; }
.ctl .gb .ic { width: 18px; height: 18px; }
.ctl .gb.big { width: 50px; height: 50px; border-radius: 25px; background: #ffffff10; }
.ctl .gb.big:hover { background: #ffffff1c; }
.trk { display: flex; flex-direction: column; gap: 2px; }
.trk .row { margin: 0; }
.trk .row.now .tt { color: var(--acc); }
.plug { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; }
.plug:hover { background: #ffffff08; }
.plug .ib { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; color: #fff; flex: none; }
.plug .ib .ic { width: 18px; height: 18px; }
.plug .tx { flex: 1; min-width: 0; }
.plug .tt { font-weight: 600; font-size: 13px; }
.plug .ts { color: var(--dim); font-size: 12px; line-height: 1.5; margin-top: 2px; }
.plug .sb { height: 30px; padding: 0 14px; flex: none; }
.plug .sb.added { color: var(--acc); }
.pretend { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: var(--dim); }
.pretend .ib { width: 64px; height: 64px; border-radius: 16px; display: grid; place-items: center; color: #fff; }
.pretend .ib .ic { width: 30px; height: 30px; }

/* under the screen, on a phone */
#below { display: none; padding: 26px 20px 40px; text-align: center; }
body.small #below { display: block; }
body.small #wrap { width: 100%; }
body.small #screen { touch-action: pan-y; }
#below h1 { font-family: Outfit, sans-serif; font-size: 26px; margin: 0 0 6px; }
#below p { color: var(--dim); margin: 0 0 18px; line-height: 1.55; }
#below .sb { height: 44px; padding: 0 22px; border-radius: 22px; font-size: 14px; text-decoration: none; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01s !important; transition-duration: .01s !important; } }

<script>
"use strict";
const REPO = "https://github.com/Llyme/not-another-dynamic-island";
const GET = REPO + "/releases/latest";
const $ = (s, r = document) => r.querySelector(s);
const scr = $("#screen"), nadi = $("#nadi"), meas = $("#meas");
const TB = 46, GAP = 6, DEPTH = 38, SIDE = 40;
let SW = 0, SH = 0, scale = 1, touch = false;

const ACC = "#5ac88c", TWO = "#e8b04a", CL = "#e08a5a", RED = "#e87a7a", TEAL = "#5ac8e6";

/* pictograms */
const F = i => `<svg viewBox="0 0 20 20" fill="currentColor">${i}</svg>`;
const S = i => `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${i}</svg>`;
const ICONS = {

  play: F('<path d="M6.2 4.1v11.8a.8.8 0 0 0 1.2.7l9.5-5.9a.8.8 0 0 0 0-1.4L7.4 3.4a.8.8 0 0 0-1.2.7z"/>'),
  pause: F('<rect x="5" y="4" width="3.7" height="12" rx="1.3"/><rect x="11.3" y="4" width="3.7" height="12" rx="1.3"/>'),
  next: F('<path d="M4 5.2v9.6a.8.8 0 0 0 1.2.6l7-4.8a.8.8 0 0 0 0-1.2l-7-4.8A.8.8 0 0 0 4 5.2z"/><rect x="13.6" y="4.5" width="2.6" height="11" rx="1.1"/>'),
  prev: F('<path d="M16 5.2v9.6a.8.8 0 0 1-1.2.6l-7-4.8a.8.8 0 0 1 0-1.2l7-4.8a.8.8 0 0 1 1.2.6z"/><rect x="3.8" y="4.5" width="2.6" height="11" rx="1.1"/>'),
  airplane: F('<path d="M9 2c.6 0 1.2.4 1.4.9l2.4 5.4 3.2-.2a1.9 1.9 0 0 1 2 1.9 1.9 1.9 0 0 1-2 1.9l-3.2-.2-2.4 5.4c-.2.6-.8.9-1.4.9a.9.9 0 0 1-.9-.9l.7-5.6-2.5-.2-1.1 2.3a.8.8 0 0 1-1.5-.4v-2.4l-1.1-.1A1.1 1.1 0 0 1 2 10v-.1c0-.5.4-1 .9-1L4 8.9V6.5a.8.8 0 0 1 1.5-.4l1.1 2.3 2.5-.2-.7-5.6c-.1-.5.3-.9.7-1z"/>'),
  hotspot: F('<path d="M10 8.25a1.75 1.75 0 1 1 0 3.5 1.75 1.75 0 1 1 0-3.5zM6.64 6.64a4.75 4.75 0 0 0 0 6.72l1.06-1.06a3.25 3.25 0 0 1 0-4.6zM13.36 6.64a4.75 4.75 0 0 1 0 6.72l-1.06-1.06a3.25 3.25 0 0 0 0-4.6zM4.52 4.52a7.75 7.75 0 0 0 0 10.96l1.06-1.06a6.25 6.25 0 0 1 0-8.84zM15.48 4.52a7.75 7.75 0 0 1 0 10.96l-1.06-1.06a6.25 6.25 0 0 0 0-8.84z"/>'),

  folder: F('<path d="M2.5 5.6A1.6 1.6 0 0 1 4.1 4h3.5l1.9 1.8h6.4a1.6 1.6 0 0 1 1.6 1.6v7a1.6 1.6 0 0 1-1.6 1.6H4.1a1.6 1.6 0 0 1-1.6-1.6z"/>'),
  gear: S('<circle cx="10" cy="10" r="2.5"/><path d="M10 2.6v2.1M10 15.3v2.1M2.6 10h2.1M15.3 10h2.1M4.8 4.8l1.5 1.5M13.7 13.7l1.5 1.5M4.8 15.2l1.5-1.5M13.7 6.3l1.5-1.5"/>'),
  globe: S('<circle cx="10" cy="10" r="7"/><path d="M3 10h14M10 3c2.3 2 2.3 12 0 14M10 3c-2.3 2-2.3 12 0 14"/>'),
  term: S('<rect x="2.5" y="4" width="15" height="12" rx="2.2"/><path d="M6 8.2l2.4 1.8L6 11.8M10.5 12.3H14"/>'),
  note: S('<path d="M5 2.6h6.8L15 5.8v11.6H5z"/><path d="M7.6 9.2h4.8M7.6 12.2h4.8"/>'),
  music: S('<path d="M8 15V5l8-2v10"/><circle cx="6" cy="15" r="2"/><circle cx="14" cy="13" r="2"/>'),
  cal: S('<rect x="3" y="4" width="14" height="13" rx="2.2"/><path d="M3 8.2h14M7 2.6v3M13 2.6v3"/>'),
  code: S('<path d="M7 5.5L2.8 10 7 14.5M13 5.5l4.2 4.5-4.2 4.5"/>'),
  get: S('<path d="M10 3v9.5M5.8 8.5l4.2 4.2 4.2-4.2"/><path d="M4 16.5h12"/>'),
  store: S('<path d="M4.2 7h11.6l-1 10H5.2z"/><path d="M7.5 7a2.5 2.5 0 0 1 5 0"/>'),
  photo: S('<rect x="3" y="4" width="14" height="12" rx="2.2"/><circle cx="7.5" cy="8.5" r="1.4"/><path d="M3.6 14.2l3.9-3.9 3 3 2-2 3.9 3.9"/>'),
  mail: S('<rect x="3" y="5" width="14" height="10" rx="2.2"/><path d="M3.6 6.2L10 11l6.4-4.8"/>'),
  calc: S('<rect x="4.5" y="2.6" width="11" height="14.8" rx="2.2"/><path d="M7.2 6.2h5.6M7.2 10h.1M10 10h.1M12.8 10h.1M7.2 13.2h.1M10 13.2h.1M12.8 13.2h.1"/>'),
  paint: S('<path d="M10 3a7 7 0 1 0 0 14c1 0 1.5-.7 1.5-1.5 0-1.2-1-1.3-1-2.3 0-.8.7-1.2 1.5-1.2H14a3 3 0 0 0 3-3C17 5.6 13.9 3 10 3z"/><circle cx="6.5" cy="9" r=".6"/><circle cx="9" cy="6.3" r=".6"/><circle cx="12.5" cy="6.8" r=".6"/>'),
  game: S('<path d="M6 7h8a4 4 0 0 1 3.8 5.2l-.6 1.9a2 2 0 0 1-3.5.6L12.5 13h-5l-1.2 1.7a2 2 0 0 1-3.5-.6l-.6-1.9A4 4 0 0 1 6 7z"/><path d="M6.5 9.4v2.2M5.4 10.5h2.2M13.5 10.2h.1"/>'),
  sun: S('<circle cx="10" cy="10" r="3.4"/><path d="M10 2.2v1.9M10 15.9v1.9M2.2 10h1.9M15.9 10h1.9M4.5 4.5l1.3 1.3M14.2 14.2l1.3 1.3M4.5 15.5l1.3-1.3M14.2 5.8l1.3-1.3"/>'),
  battery: S('<rect x="2.5" y="6" width="13" height="8" rx="2.2"/><path d="M17.6 9v2"/>'),
  burst: S('<path d="M10 2.6v14.8M2.6 10h14.8M4.8 4.8l10.4 10.4M15.2 4.8L4.8 15.2" stroke-width="2.1"/>'),
  volume: S('<path d="M3.8 7.8h3l4.2-3.3v11l-4.2-3.3h-3z"/><path d="M14 7.4a3.6 3.6 0 0 1 0 5.2"/>'),
  chevup: S('<path d="M6 12l4-4 4 4"/>'),
  arrow: S('<path d="M10 16V4.5M5.2 9.2L10 4.4l4.8 4.8"/>'),
  open: S('<path d="M11 4h5v5M16 4l-7 7"/><path d="M14 11.5V16H4V6h4.5"/>'),
  pin: S('<path d="M8 3h4l-.6 5 2.6 2.6v1.2H6v-1.2L8.6 8z"/><path d="M10 11.8V17"/>'),
  eye: S('<path d="M2.5 10s2.7-5 7.5-5 7.5 5 7.5 5-2.7 5-7.5 5-7.5-5-7.5-5z"/><circle cx="10" cy="10" r="2.2"/>'),
  check: S('<path d="M4.5 10.5l3.5 3.5 7.5-8"/>'),
  win: F('<rect x="3" y="3" width="6.6" height="6.6" rx=".8"/><rect x="10.4" y="3" width="6.6" height="6.6" rx=".8"/><rect x="3" y="10.4" width="6.6" height="6.6" rx=".8"/><rect x="10.4" y="10.4" width="6.6" height="6.6" rx=".8"/>'),
  drive: S('<rect x="3" y="6" width="14" height="8" rx="2.2"/><path d="M6 10h.1M13 10h1"/>'),
};
const ic = (n, sz, st = "") => `<i class="ic" style="width:${sz}px;height:${sz}px;${st}">${ICONS[n] || ""}</i>`;
const wifi = (lv, sz = 16, c = "currentColor") => {
  const a = k => `opacity="${lv >= k ? 1 : .28}"`;
  return `<i class="ic" style="width:${sz}px;height:${sz}px;color:${c}"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path ${a(3)} d="M2.5 7.6a10.6 10.6 0 0 1 15 0"/><path ${a(2)} d="M5 10.5a7 7 0 0 1 10 0"/><path ${a(1)} d="M7.5 13.3a3.4 3.4 0 0 1 5 0"/><circle cx="10" cy="15.8" r="1.1" fill="currentColor" stroke="none"/></svg></i>`;
};
const flow = (up, c) => `<span class="flow ${up ? "up" : "dn"}" style="color:${c || "currentColor"}"><svg viewBox="0 0 8 24">${up ? '<path d="M1 7.5l3-3 3 3M1 13.5l3-3 3 3M1 19.5l3-3 3 3M1 25.5l3-3 3 3"/>' : '<path d="M1 4.5l3 3 3-3M1 10.5l3 3 3-3M1 16.5l3 3 3-3M1 22.5l3 3 3-3"/>'}</svg></span>`;
const ring = (letter, p, sz = 22, c = ACC) => `<svg width="${sz}" height="${sz}" viewBox="0 0 24 24" style="flex:none"><circle cx="12" cy="12" r="10" fill="none" stroke="#2a2b31" stroke-width="2.4"/><circle cx="12" cy="12" r="10" fill="none" stroke="${c}" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="${(p * 62.8).toFixed(1)} 62.8" transform="rotate(-90 12 12)"/><text x="12" y="15.6" text-anchor="middle" font-size="10" font-weight="700" fill="#f2f2f5" font-family="Outfit, sans-serif">${letter}</text></svg>`;
const rate = b => b >= 1e6 ? (b / 1e6).toFixed(1) + " MB/s" : Math.round(b / 1e3) + " KB/s";
const pad = n => String(n).padStart(2, "0");
const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const MONS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const clock = d => { const h = d.getHours(); return { t: (h % 12 || 12) + ":" + pad(d.getMinutes()), ap: h < 12 ? "AM" : "PM" }; };
const span = d => { const c = clock(d); return c.t + " " + c.ap; };
const mmss = s => Math.floor(s / 60) + ":" + pad(Math.floor(s % 60));

/* what the pretend PC is doing */
const T0 = new Date(); T0.setSeconds(0, 0);
const at = min => new Date(Math.ceil(T0.getTime() / 300000) * 300000 + min * 60000);
const EVENTS = [
  { title: "Standup", s: at(-150), m: 15, where: "Team Room" },
  { title: "Design Review", s: at(25), m: 30, where: "Meet", link: true },
  { title: "Gym", s: at(250), m: 60, where: "" },
  { title: "Dinner With Sam", s: at(60 * 24 + 120), m: 90, where: "Noodle House" },
  { title: "Dentist", s: at(60 * 48 - 200), m: 30, where: "" },
];
const cal = { sel: 0 };
const TRACKS = [
  { title: "Late Night Study", artist: "Lofi Beats", len: 168, a: "#e8b04a", b: "#e87a7a", c: "#7a5ae8" },
  { title: "Rainy Window", artist: "Cafe Sessions", len: 201, a: "#5ac8e6", b: "#3d6fd6", c: "#1b2a5c" },
  { title: "Neon Drive", artist: "Synthwave FM", len: 187, a: "#e86aa8", b: "#7a5ae8", c: "#201040" },
];
const music = { i: 0, t: 41, playing: true };
const dl = { items: [{ name: "Starfield Odyssey", from: "Games", size: 48e9, p: .58, a: "#3d6fd6", b: "#e8b04a" }], done: [{ name: "photos-2026.zip", from: "Browser" }], hist: Array(40).fill(0).map((_, i) => 3e6 + Math.sin(i / 3) * 1e6), rate: 4.2e6 };
const NEXT_DL = [{ name: "Hollow Night", from: "Games", size: 9e9, a: "#5ac88c", b: "#1b2a5c" }, { name: "Ubuntu 26.04.iso", from: "Browser", size: 6e9, a: "#e87a7a", b: "#7a5ae8" }];
const drives = [
  { l: "C", name: "Windows", size: 476, used: 264, r: 0, w: 0 },
  { l: "D", name: "Games", size: 1863, used: 1210, r: 0, w: 0 },
  { l: "E", name: "Elderberry", size: 64, used: 12, r: 0, w: 0, usb: true },
];
const net = { wifi: true, air: false, hot: false, down: 18e6, up: 2.1e6 };
const claude = { asks: 0, sessions: [{ name: "nadi", what: "Editing frame.rs", st: "work" }, { name: "site", what: "Waiting for you", st: "idle" }] };

/* the widgets: what each shows at rest (along an edge, or on a side edge, its icon alone), and opened */
const W = {
  calendar: {
    tip: () => { const n = nextEvent(); return n ? n.title + "\n" + soonWords(n) : "Nothing coming up"; },
    peek: v => {
      const n = nextEvent(), d = new Date(), soon = n && n.s - d <= 3600e3, last = n && n.s - d <= 600e3;
      const dot = soon ? `<span class="dot${last ? " pulse" : ""}" style="background:${last ? TWO : ACC}"></span>` : "";
      if (v) return `<svg width="20" height="22" viewBox="0 0 20 22"><rect x="1" y="1" width="18" height="20" rx="4" fill="#1d1e24"/><path d="M1 5a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4v2H1z" fill="${soon ? (last ? TWO : ACC) : "#3a3b44"}"/><text x="10" y="17.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#f2f2f5" font-family="Outfit, sans-serif">${d.getDate()}</text></svg>`;
      return `<span>${DAYS[d.getDay()].slice(0, 3)}</span>${dot}`;
    },
    w: 340,
    body: () => {
      const d = new Date(), c = clock(d);
      const sel = new Date(); sel.setHours(0, 0, 0, 0); sel.setDate(sel.getDate() + cal.sel);
      const ws = new Date(sel); ws.setDate(sel.getDate() - sel.getDay());
      let week = "";
      for (let i = 0; i < 7; i++) {
        const day = new Date(ws); day.setDate(ws.getDate() + i);
        const off = Math.round((day - new Date(new Date().setHours(0, 0, 0, 0))) / 864e5);
        const n = EVENTS.filter(e => sameDay(e.s, day)).length;
        week += `<button data-act="day" data-v="${off}" class="${off === 0 ? "today" : ""} ${off === cal.sel ? "on" : ""}"><small>${"SMTWTFS"[i]}</small><b>${day.getDate()}</b><span class="ds">${"<i></i>".repeat(Math.min(n, 3))}</span></button>`;
      }
      let out = `<div class="dayhead"><div class="big tab">${c.t}<small>${c.ap}</small></div><div class="dr"><b>${DAYS[sel.getDay()]}</b><span>${MONS[sel.getMonth()]} ${sel.getDate()}</span></div></div><div class="week">${week}</div>`;
      const n = nextEvent();
      if (n && cal.sel === 0) {
        const left = n.s - d, p = clamp(left / 3600e3, 0, 1), col = left <= 600e3 ? TWO : ACC;
        out += `<div class="card"><svg width="42" height="42" viewBox="0 0 42 42" style="flex:none"><circle cx="21" cy="21" r="18" fill="none" stroke="#24252c" stroke-width="3.5"/><circle cx="21" cy="21" r="18" fill="none" stroke="${col}" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="${(p * 113).toFixed(1)} 113" transform="rotate(-90 21 21)"/><text x="21" y="25" text-anchor="middle" font-size="11" font-weight="700" fill="#f2f2f5" font-family="Outfit, sans-serif">${soonShort(left)}</text></svg><div style="flex:1;min-width:0"><div style="font-weight:600;font-size:13.5px">${n.title}</div><div class="mut" style="font-size:12px;margin-top:2px">${span(n.s)}${n.where ? ", " + n.where : ""}</div></div>${n.link ? `<button class="sb" data-act="join" style="background:${col};color:#04130b" data-tip="Join the call">Join</button>` : ""}</div>`;
      }
      const list = EVENTS.filter(e => sameDay(e.s, sel)).sort((a, b) => a.s - b.s);
      if (list.length) {
        let rows = "", nowPut = cal.sel !== 0;
        for (const e of list) {
          if (!nowPut && e.s > d) { rows += '<div class="now"></div>'; nowPut = true; }
          const past = new Date(e.s.getTime() + e.m * 60000) < d;
          rows += `<div class="ev${past ? " past" : ""}"><div class="tm tab">${clock(e.s).t}</div><div class="cb"></div><div class="tx" style="display:flex;flex-direction:column;gap:2px"><b style="font-size:12.5px">${e.title}</b><span class="mut" style="font-size:11.5px">${span(e.s)} to ${span(new Date(e.s.getTime() + e.m * 60000))}</span></div></div>`;
        }
        if (!nowPut) rows += '<div class="now"></div>';
        out += `<div class="tl">${rows}</div>`;
      }
      return out;
    },
    open: () => { cal.sel = 0; },
  },
  music: {
    tip: () => TRACKS[music.i].title + "\n" + TRACKS[music.i].artist,
    peek: v => {
      const bars = `<span class="bars${music.playing ? "" : " still"}"><i></i><i></i><i></i></span>`;
      if (v) return bars;
      return `${bars}<span class="mq"><span>${TRACKS[music.i].title}</span></span>`;
    },
    w: 330,

/* the mouse on them: a swell, then open (on a touch, a tap opens); a press keeps one open; one open at a time */

scr.addEventListener("pointerover", e => {
  if (e.pointerType === "touch") return;
  const el = e.target.closest("[data-tip], .w");
  if (el === tipFor) return;
  hideTip();
  if (!el || drag) return;
  tipFor = el;
  tipT = setTimeout(() => {
    const t = tipText(el); if (!t) return;
    tip.textContent = t;
    const r = el.getBoundingClientRect(), sr = scr.getBoundingClientRect();
    const x = (r.left - sr.left) / scale, y = (r.top - sr.top) / scale, w = r.width / scale, h = r.height / scale;
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    let tx = clamp(x + w / 2 - tw / 2, 6, SW - tw - 6), ty = y + h + 8;
    if (ty + th > SH - TB - 4) ty = y - th - 8;
    tip.style.left = tx + "px"; tip.style.top = ty + "px";
    tip.classList.add("show");
  }, 520);
});
scr.addEventListener("pointerout", e => { if (!e.relatedTarget || !tipFor || !tipFor.contains(e.relatedTarget)) hideTip(); });
function hideTip() { clearTimeout(tipT); tipFor = null; tip.classList.remove("show"); }

/* the pointer: eyes follow it; drags; a press elsewhere shuts what is open */
addEventListener("pointermove", e => {
  moveDrag(e);
  const p = pt(e);
  for (const eyes of document.querySelectorAll(".eyes")) {
    const r = eyes.getBoundingClientRect(), sr = scr.getBoundingClientRect();
    const cx = (r.left + r.width / 2 - sr.left) / scale, cy = (r.top + r.height / 2 - sr.top) / scale;
    const dx = p.x - cx, dy = p.y - cy, d = Math.hypot(dx, dy) || 1, k = Math.min(1, d / 260);
    eyes.style.setProperty("--ex", (dx / d * 3 * k).toFixed(2) + "px");
    eyes.style.setProperty("--ey", (dy / d * 3 * k).toFixed(2) + "px");
  }
});
addEventListener("pointerup", endDrag);
scr.addEventListener("pointerdown", e => {
  touch = e.pointerType === "touch";
  hideTip();
  if (!e.target.closest("#menu")) hideMenu();
  if (!e.target.closest(".w")) for (const k in st) if (st[k].open && st[k].pinned) close(k);
  if (!e.target.closest("#launch, [data-act=start], .w")) hideLauncher();
});
scr.addEventListener("contextmenu", e => {
  e.preventDefault();
  if (e.target.closest(".w, .win, #taskbar, #launch")) return;
  showMenu(e, [
    { icon: "get", label: "Get NADI", run: () => window.open(GET, "_blank", "noopener") },
    { icon: "code", label: "GitHub", run: () => window.open(REPO, "_blank", "noopener") },
    { icon: "note", label: "Read Me", run: () => openApp("notepad") },
  ]);
});
addEventListener("keydown", e => {
  if (e.key === "Escape") { hideLauncher(); hideMenu(); closeAll(); modal.classList.remove("show"); }
});
setInterval(() => {
  for (const eyes of document.querySelectorAll(".eyes")) { eyes.classList.add("blink"); setTimeout(() => eyes.classList.remove("blink"), 130); }
}, 4200);

/* time goes on: the clock, the music, the downloads, the drives, the network */
function tick() {
  const t = TRACKS[music.i];
  if (music.playing) {
    music.t += 1;
    if (music.t >= t.len) { music.i = (music.i + 1) % TRACKS.length; music.t = 0; syncMusic(); }
  }
  const mb = $("#mbar"), mt = $("#mtime");
  if (mb) { mb.style.width = (music.t / TRACKS[music.i].len * 100).toFixed(1) + "%"; mt.textContent = mmss(music.t); }
  dl.rate = clamp(dl.rate + (Math.random() - .5) * 1.2e6, 1.8e6, 7.5e6);
  dl.hist.push(dl.rate); dl.hist.shift();
  const it = dl.items[0];
  if (it) {
    it.p = Math.min(1, it.p + dl.rate / it.size * 40);
    if (it.p >= 1) {
      dl.items.shift();
      dl.done.unshift({ name: it.name, from: it.from }); dl.done.length = Math.min(dl.done.length, 3);
      banner("dl", `<div style="padding:14px 16px;display:flex;gap:12px;align-items:center"><div style="width:42px;height:42px;border-radius:10px;flex:none;background:linear-gradient(135deg,${it.a},${it.b})"></div><div style="flex:1"><div class="out" style="font-size:14.5px;font-weight:600">${it.name}</div><div class="mut" style="font-size:12px;margin-top:2px">Downloaded</div></div><button class="gb" data-act="dlopen" data-tip="Open">${ic("open", 15)}</button></div>`, 300, ACC, 5000);
      const nx = NEXT_DL.shift(); nx.p = 0; dl.items.push(nx); NEXT_DL.push({ ...it, p: 0 });
    }
  }
  for (const d of drives) {
    d.r = Math.random() < .3 ? Math.random() * 9e7 : Math.random() * 2e5;
    d.w = Math.random() < .2 ? Math.random() * 4e7 : Math.random() * 1e5;
  }
  net.down = clamp(net.down + (Math.random() - .5) * 6e6, 2e6, 40e6);
  net.up = clamp(net.up + (Math.random() - .5) * 1e6, 3e5, 6e6);
  for (const k in st) refresh(k);
  const c = $("#clock"); if (c) { const d = new Date(); c.innerHTML = `${span(d)}<br>${d.getMonth() + 1}/${d.getDate()}/${d.getFullYear()}`; }
}

/* the screen: the window's own size; on a phone, a 1280 by 760 one shrunk to fit */
const wrap = $("#wrap");
function fit() {
  const small = innerWidth < 820 || innerHeight < 480;
  document.body.classList.toggle("small", small);
  if (small) {
    SW = 1280; SH = 760; scale = innerWidth / SW;
    scr.style.width = SW + "px"; scr.style.height = SH + "px"; scr.style.transform = `scale(${scale})`;
    wrap.style.height = SH * scale + "px";
  } else {
    SW = innerWidth; SH = innerHeight; scale = 1;
    scr.style.width = SW + "px"; scr.style.height = SH + "px"; scr.style.transform = "none";
    wrap.style.height = SH + "px";
  }
  layout();
}
addEventListener("resize", fit);

/* start: the widgets come out of their edges, one after another */
for (const e in edges) for (const id of edges[e]) make(id, e);
taskbar(); tray();
fit();
// (the fonts come late, or not at all: the widgets come out anyway, and are measured again when they do)
setTimeout(boot, 350);
if (document.fonts) document.fonts.ready.then(() => { for (const k in st) renderPeek(st[k], true); layout(); });
openApp("notepad");
openApp("music");
{ const w = openWins.notepad.el; w.style.left = Math.max(110, SW * .1) + "px"; w.style.top = Math.max(60, SH * .12) + "px"; }
{ const w = openWins.music.el; w.style.left = clamp(SW * .56, 560, SW - 480) + "px"; w.style.top = Math.max(80, SH * .2) + "px"; }
focusWin("notepad");
setInterval(tick, 1000);
setTimeout(claudeAsk, 14000);
</script>
