<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NADI</title>
<meta name="description" content="Widgets that live on the edges of your Windows screen. Try them on a pretend PC: hover, open, drag and play with everything.">
<meta name="theme-color" content="#000000">
<meta property="og:title" content="NADI: Not Another Dynamic Island">
<meta property="og:description" content="Widgets on the edges of your Windows screen. Try them on a pretend PC.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* The page is a pretend Windows screen with NADI running on it. NADI's part is drawn the way the app draws it: its widgets are one
   liquid (a metaball, drawn on the graphics card with the app's own shader), merged into the screen's edges, sized and sprung with
   the app's own numbers; what is in them is drawn over the liquid. */
:root {
  color-scheme: dark;
  --acc: #5ac88c;
  --two: #e8b04a;
  --claude: #d97757;
  --red: #e87a7a;
  --teal: #5ac8e6;
  --blue: #4f8ff0;
  --text: #f2f2f5;
  --dim: #9a9aa4;
  --track: #1b1b20;
  --chosen: #34343b;
  --lit: #26262b;
  --tile: #161619;
  --tb: 46px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #000; color: var(--text); font-family: Inter, "Segoe UI", system-ui, sans-serif; font-size: 12.5px; }
body { overflow: hidden; }
body.small { overflow: auto; height: auto; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: default; }
a { color: inherit; }
#wrap { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
#screen { position: absolute; left: 0; top: 0; width: 100vw; height: 100vh; overflow: hidden; transform-origin: 0 0; user-select: none; -webkit-user-select: none; touch-action: none; }
body.small #screen { touch-action: pan-y; }
.ic { display: inline-block; flex: none; }
.ic svg { display: block; width: 100%; height: 100%; }
.tab { font-variant-numeric: tabular-nums; }
.out { font-family: Outfit, Inter, sans-serif; }

#wall { position: absolute; inset: 0; background:
  radial-gradient(42% 52% at 68% 56%, #8fb6ff 0%, #5d8ff0 22%, transparent 60%),
  radial-gradient(60% 70% at 74% 62%, #2f5fd0 0%, transparent 65%),
  radial-gradient(50% 60% at 30% 90%, #3a2a8a 0%, transparent 70%),
  radial-gradient(70% 80% at 12% 6%, #142456 0%, transparent 70%),
  linear-gradient(160deg, #0b1534, #13275c 55%, #091128); }

#icons { position: absolute; left: 54px; top: 54px; display: flex; flex-direction: column; gap: 6px; z-index: 2; }
.dk { width: 84px; padding: 8px 4px 6px; border-radius: 6px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11.5px; color: #fff; text-shadow: 0 1px 3px #000c; text-align: center; line-height: 1.25; }
.dk:hover { background: #ffffff1a; }
.dk .ib { width: 44px; height: 44px; border-radius: 11px; display: grid; place-items: center; box-shadow: 0 6px 16px #0006; color: #fff; }
.dk .ib .ic { width: 22px; height: 22px; }

/* windows */
#wins { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
.win { position: absolute; pointer-events: auto; display: flex; flex-direction: column; background: #1e1f25f2; border: 1px solid #ffffff16; border-radius: 9px; box-shadow: 0 24px 60px #0009, 0 2px 8px #0005; overflow: hidden; transition: opacity .18s, transform .22s cubic-bezier(.2,.9,.3,1); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); }
.win.gone { opacity: 0; transform: translateY(16px) scale(.96); pointer-events: none; }
.wbar { height: 34px; flex: none; display: flex; align-items: center; padding-left: 12px; gap: 9px; font-size: 12px; color: #d6d6dc; }
.wbar .ic { width: 15px; height: 15px; }
.wbar .sp { flex: 1; }
.wbar button { width: 44px; height: 34px; display: grid; place-items: center; color: #c9c9d1; }
.wbar button .ic { width: 13px; height: 13px; }
.wbar button:hover { background: #ffffff14; }
.wbar button.cl:hover { background: #c42b1c; color: #fff; }
.wbody { flex: 1; min-height: 0; overflow: auto; }
.wbody::-webkit-scrollbar { width: 10px; }
.wbody::-webkit-scrollbar-thumb { background: #ffffff22; border-radius: 5px; border: 3px solid transparent; background-clip: padding-box; }

#taskbar { position: absolute; left: 0; right: 0; bottom: 0; height: var(--tb); z-index: 40; background: #1c1d24e0; border-top: 1px solid #ffffff10; backdrop-filter: blur(30px) saturate(1.4); -webkit-backdrop-filter: blur(30px) saturate(1.4); display: flex; align-items: center; justify-content: center; }
.tk { position: relative; width: 40px; height: 40px; border-radius: 6px; display: grid; place-items: center; }
.tk:hover { background: #ffffff12; }
.tk .ib { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; color: #fff; }
.tk .ib .ic { width: 15px; height: 15px; }
.tk::after { content: ""; position: absolute; bottom: 2px; left: 50%; width: 0; height: 3px; border-radius: 2px; background: #9a9aa6; transform: translateX(-50%); transition: width .2s; }
.tk.run::after { width: 6px; }
.tk.front::after { width: 16px; background: var(--acc); }
#tray { position: absolute; right: 8px; top: 0; bottom: 0; display: flex; align-items: center; gap: 2px; }
#tray .tt { height: 38px; padding: 0 8px; border-radius: 6px; display: flex; align-items: center; gap: 9px; font-size: 11.5px; color: #e4e4ea; }
#tray .tt:hover { background: #ffffff12; }
#tray .tt .ic { width: 15px; height: 15px; }
#clock { text-align: right; line-height: 1.35; }

/* NADI: the liquid under, what is in each widget over it */
#nadi { position: absolute; inset: 0; z-index: 50; pointer-events: none; }
#liquid { position: absolute; left: 0; top: 0; }
.wc { position: absolute; pointer-events: auto; overflow: hidden; }
.wc.solid { background: #000; }
.pk { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 12px; white-space: nowrap; font-weight: 600; font-size: 12.5px; }
.wc.v .pk { flex-direction: column; padding: 0; gap: 6px; }
.pb { position: absolute; left: 0; top: 0; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.e-bottom .pb { top: auto; bottom: 0; }
.e-right .pb { left: auto; right: 0; }
#meas { position: absolute; left: -9999px; top: 0; visibility: hidden; }
#meas.h { display: inline-flex; align-items: center; gap: 8px; padding: 0 12px; height: 32px; white-space: nowrap; font-weight: 600; font-size: 12.5px; }
#meas.vv { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; width: 40px; font-weight: 600; font-size: 12.5px; }
.dim { color: var(--dim); font-weight: 500; }

/* peeks */
.page { width: 24px; height: 26px; border-radius: 6px; background: #26262b; position: relative; overflow: hidden; flex: none; }
.page i { position: absolute; left: 0; right: 0; top: 0; height: 8px; font-style: normal; font-size: 5.5px; font-weight: 700; color: #04130b; text-align: center; line-height: 8px; }
.page b { position: absolute; left: 0; right: 0; bottom: 2px; text-align: center; font-size: 12px; font-weight: 700; font-family: Outfit, sans-serif; }
.pdot { width: 6px; height: 6px; border-radius: 3px; background: var(--acc); flex: none; }
.pdot.pulse { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.5); opacity: .55; } }
.cv { width: 24px; height: 24px; border-radius: 6px; background: #26262b; display: grid; place-items: center; color: #d6d6dc; flex: none; overflow: hidden; }
.two { display: flex; flex-direction: column; line-height: 1.2; }
.two small { font-size: 11px; color: var(--dim); font-weight: 500; }
.viz { display: flex; gap: 2px; align-items: center; height: 14px; }
.viz i { display: block; width: 3px; height: 6px; border-radius: 2px; background: currentColor; animation: viz .9s ease-in-out infinite alternate; }
.viz i:nth-child(2) { animation-duration: .7s; }
.viz i:nth-child(3) { animation-duration: 1.1s; }
.viz i:nth-child(4) { animation-duration: .8s; }
.viz.still i { animation: none; height: 4px; opacity: .5; }
@keyframes viz { to { height: 14px; } }
.eyes { display: flex; gap: 9px; align-items: center; --ex: 0px; --ey: 0px; }
.wc.v .eyes { flex-direction: column; gap: 10px; }
.eyes i { display: block; width: 14px; height: 15px; border-radius: 8px; background: #fff; transform: translate(var(--ex), var(--ey)); transition: transform .12s, height .09s; }
.wc.v .eyes i { width: 15px; height: 13px; }
.eyes.blink i { height: 2px !important; }
.eyes.happy i { height: 6px !important; border-radius: 8px 8px 2px 2px; }
.flow { display: inline-block; width: 8px; height: 12px; overflow: hidden; -webkit-mask: linear-gradient(transparent, #000 30%, #000 70%, transparent); mask: linear-gradient(transparent, #000 30%, #000 70%, transparent); vertical-align: -1px; flex: none; }
.flow svg { display: block; width: 8px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.flow.dn svg { animation: fdn .625s linear infinite; }
.flow.up svg { animation: fup .625s linear infinite; }
@keyframes fdn { from { transform: translateY(-12px); } to { transform: translateY(-6px); } }
@keyframes fup { from { transform: translateY(-6px); } to { transform: translateY(-12px); } }
.mq { overflow: hidden; }
.mq > span { display: inline-block; }

/* panels: the app's blocks */
.gb { height: 32px; min-width: 32px; padding: 0 10px; border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: #c9c9d1; }
.gb:hover { background: var(--lit); }
.gb .ic { width: 16px; height: 16px; }
.card { background: var(--track); border-radius: 18px; padding: 14px 16px; display: flex; gap: 14px; align-items: center; }
.lab { font-size: 12px; font-weight: 600; color: var(--dim); }
.row { width: 100%; text-align: left; display: flex; align-items: center; gap: 12px; min-height: 30px; padding: 0 8px; margin: 0 -8px; width: calc(100% + 16px); border-radius: 10px; }
.row.go:hover { background: var(--lit); }
.row .tx { flex: 1; min-width: 0; font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; }
.row .mk { display: flex; gap: 8px; color: var(--dim); }
.row .mk .ic { width: 12px; height: 12px; }
.toggles { display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: var(--track); }
.toggles button { flex: 1; height: 32px; border-radius: 11px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13.5px; font-weight: 600; color: var(--dim); }
.toggles button:hover { background: var(--lit); }
.toggles button.on { background: #24242a; color: var(--text); }
.toggles button.on .ic { color: var(--acc); }
.toggles .ic { width: 16px; height: 16px; }
.bar { height: 4px; border-radius: 2px; background: #26262b; overflow: hidden; position: relative; }
.bar > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: var(--c, var(--acc)); }
.ghost { width: 30px; height: 30px; border-radius: 15px; display: grid; place-items: center; color: #b4b4bc; }
.ghost:hover { background: var(--lit); }
.ghost .ic { width: 15px; height: 15px; }
.dayhead { display: flex; align-items: center; }
.dayhead .big { font-family: Outfit, sans-serif; font-size: 36px; font-weight: 600; line-height: 1; letter-spacing: -.3px; }
.dayhead .big small { font-size: 15px; color: var(--dim); margin-left: 5px; font-weight: 500; }
.dayhead .dr { margin-left: auto; text-align: right; display: flex; flex-direction: column; gap: 3px; }
.dayhead .dr span { font-size: 13px; color: var(--dim); }
.dayhead .dr b { font-size: 14px; font-weight: 600; }
.week { display: flex; align-items: center; }
.week .ghost { color: var(--dim); }
.week .days { flex: 1; display: grid; grid-template-columns: repeat(7, 1fr); }
.week .d { height: 60px; margin: 0 2px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
.week .d:hover { background: var(--lit); }
.week .d small { font-size: 10.5px; color: var(--dim); font-weight: 600; }
.week .d b { font-size: 17px; font-family: Outfit, sans-serif; font-weight: 600; }
.week .d.today b { color: var(--acc); }
.week .d.on { background: #f2f2f5; }
.week .d.on small, .week .d.on b { color: #000; }
.week .ds { display: flex; gap: 2px; height: 4px; }
.week .ds i { width: 4px; height: 4px; border-radius: 2px; background: var(--acc); }
.tl { display: flex; flex-direction: column; gap: 8px; }
.tl .ev { display: flex; gap: 12px; }
.tl .tm { width: 40px; text-align: right; font-size: 12.5px; color: var(--dim); padding-top: 9px; flex: none; }
.tl .bx { flex: 1; border-radius: 8px; background: #5ac88c12; position: relative; padding: 9px 12px 9px 14px; display: flex; flex-direction: column; gap: 3px; }
.tl .bx::before { content: ""; position: absolute; left: 0; top: 4px; bottom: 4px; width: 3px; border-radius: 2px; background: var(--acc); }
.tl .bx b { font-size: 14px; font-weight: 600; }
.tl .bx span { font-size: 13px; color: var(--dim); }
.tl .ev.past { opacity: .45; }
.tl .now { height: 2px; background: var(--red); margin-left: 52px; position: relative; border-radius: 1px; }
.tl .now::before { content: ""; position: absolute; left: -3px; top: -3px; width: 8px; height: 8px; border-radius: 4px; background: var(--red); }
.join { height: 36px; padding: 0 14px; border-radius: 18px; background: var(--acc); color: #04130b; display: inline-flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 600; flex: none; }
.join .ic { width: 12px; height: 12px; }
.drv { display: flex; gap: 14px; align-items: center; border-radius: 12px; padding: 6px 8px; margin: -6px -8px; }
.drv:hover { background: #ffffff08; }
.drv .tile { width: 46px; height: 46px; border-radius: 12px; background: #26262b; position: relative; overflow: hidden; display: grid; place-items: center; flex: none; }
.drv .tile b { position: relative; font-family: Outfit, sans-serif; font-size: 22px; font-weight: 600; }
.drv .tile svg { position: absolute; left: 0; bottom: 0; width: 92px; height: 100%; animation: wave 2.4s linear infinite; }
@keyframes wave { to { transform: translateX(-46px); } }
.drv .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.drv .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.drv .top .tt { font-size: 15px; font-weight: 600; }
.drv .top .sz { font-size: 13px; color: var(--dim); }
.drv .top .sz b { color: var(--text); font-weight: 600; }
.drv .graph { display: flex; align-items: center; gap: 8px; height: 20px; }
.drv .graph svg { flex: 1; height: 20px; }
.drv .graph span { font-size: 13px; font-weight: 600; color: var(--blue); white-space: nowrap; }
.xfer { display: flex; flex-direction: column; gap: 10px; }
.xfer .hd { display: flex; align-items: center; gap: 12px; }
.xfer .ti { width: 32px; height: 32px; border-radius: 9px; background: var(--track); display: grid; place-items: center; color: #b4b4bc; flex: none; }
.xfer .ti .ic { width: 16px; height: 16px; }
.xfer .nm { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.xfer .nm b { font-size: 14px; font-weight: 600; }
.xfer .nm span { font-size: 12.5px; color: var(--dim); }
.xfer .rt { font-size: 14px; font-weight: 600; }
.done { display: flex; align-items: center; gap: 12px; height: 34px; }
.done .ic.ok { width: 18px; height: 18px; color: var(--acc); }
.done .nm { flex: 1; font-size: 14px; }
.cover { border-radius: 16px; margin: 0 auto; display: grid; place-items: center; color: #ffffffcc; }
.songhead { display: flex; align-items: center; gap: 10px; }
.songhead .nm { flex: 1; min-width: 0; }
.songhead b { display: block; font-family: Outfit, sans-serif; font-size: 18px; font-weight: 600; }
.songhead span { font-size: 14px; color: var(--dim); }
.seek .bar { height: 5px; border-radius: 3px; }
.seek .bar > i { background: #f2f2f5; }
.seek .tm { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--dim); margin-top: 7px; }
.ctl { display: flex; align-items: center; justify-content: center; gap: 22px; }
.ctl .ghost { width: 44px; height: 44px; border-radius: 22px; color: #f2f2f5; }
.ctl .ghost .ic { width: 20px; height: 20px; }
.ctl .main { width: 52px; height: 52px; border-radius: 26px; background: #f2f2f5; color: #000; display: grid; place-items: center; }
.ctl .main .ic { width: 22px; height: 22px; }
.sec { display: flex; flex-direction: column; gap: 10px; }
.sec .hd { display: flex; align-items: center; gap: 12px; }
.sec .ct { width: 34px; height: 34px; border-radius: 10px; background: var(--claude); color: #fff; display: grid; place-items: center; font-family: Outfit, sans-serif; font-weight: 600; font-size: 16px; flex: none; }
.sec .nm { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.sec .nm b { font-size: 14px; font-weight: 600; }
.sec .nm span { font-size: 12.5px; color: var(--dim); }
.strip { border-radius: 10px; padding: 8px 12px; display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 600; }
.ban { display: flex; flex-direction: column; gap: 12px; }
.ban .hd { display: flex; align-items: center; gap: 12px; }
.ban .btns { display: flex; gap: 8px; }
.ban .btns button { flex: 1; height: 36px; border-radius: 18px; font-size: 13.5px; font-weight: 600; }
.ban .btns .no { color: #c9c9d1; }
.ban .btns .no:hover { background: var(--lit); }

/* the launcher */
#launch { position: absolute; z-index: 60; width: 460px; background: #000; border-radius: 26px; padding: 20px; display: flex; flex-direction: column; gap: 14px; opacity: 0; transform: translateY(14px) scale(.94); pointer-events: none; transition: opacity .16s, transform .32s cubic-bezier(.3,1.3,.5,1); }
#launch.show { opacity: 1; transform: none; pointer-events: auto; }
.search { height: 42px; border-radius: 21px; background: #121214; display: flex; align-items: center; gap: 12px; padding: 0 5px 0 16px; }
.search > .ic { width: 15px; height: 15px; color: var(--dim); }
.search input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--text); font: inherit; font-size: 13.5px; caret-color: var(--acc); }
.search .all { width: 30px; height: 30px; border-radius: 15px; background: #26262b; display: grid; place-items: center; color: #c9c9d1; }
.search .all .ic { width: 13px; height: 13px; }
.pins { display: grid; grid-template-columns: repeat(6, 1fr); row-gap: 4px; }
.pin { height: 78px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; font-size: 12px; color: #e4e4ea; min-width: 0; padding: 0 2px; }
.pin:hover { background: #ffffff0d; }
.pin > span:last-child { max-width: 100%; overflow: hidden; white-space: nowrap; }
.tile36 { width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; color: #fff; flex: none; background: var(--tile); }
.tile36 .ic { width: 16px; height: 16px; }
.foot { display: flex; justify-content: center; gap: 12px; border-top: 1px solid #ffffff14; padding-top: 12px; }
.foot button { width: 36px; height: 36px; border-radius: 18px; display: grid; place-items: center; color: #b4b4bc; }
.foot button.red { color: var(--red); }
.foot button:hover { background: var(--lit); }
.foot .ic { width: 16px; height: 16px; }
.list { display: flex; flex-direction: column; max-height: 330px; overflow: auto; }
.list .row { margin: 0; width: 100%; min-height: 44px; }
.list .row .tx { font-size: 13.5px; }

#menu { position: absolute; z-index: 70; min-width: 190px; background: #000; border-radius: 16px; padding: 6px; display: none; flex-direction: column; animation: grow .22s cubic-bezier(.3,1.3,.5,1); }
#menu.show { display: flex; }
@keyframes grow { from { transform: scale(.85); opacity: 0; } }
#menu button { height: 34px; padding: 0 12px; border-radius: 11px; display: flex; align-items: center; gap: 10px; font-size: 12.5px; text-align: left; }
#menu button:hover { background: var(--lit); }
#menu .ic { width: 16px; height: 16px; color: var(--dim); }
#tip { position: absolute; z-index: 100; background: #000; color: var(--text); border-radius: 12px; padding: 8px 12px; font-size: 12.5px; white-space: pre-line; max-width: 260px; line-height: 1.45; opacity: 0; transition: opacity .14s; pointer-events: none; }
#tip.show { opacity: 1; }
#modal { position: absolute; inset: 0; z-index: 80; display: none; place-items: center; }
#modal.show { display: grid; }
#modal .dim2 { position: absolute; inset: 0; background: #0008; animation: fade .25s; }
@keyframes fade { from { opacity: 0; } }
#modal .card2 { position: relative; width: 300px; background: #000; border-radius: 26px; padding: 22px 20px 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; animation: pop .34s cubic-bezier(.3,1.3,.5,1); }
@keyframes pop { from { transform: scale(.6); opacity: 0; } }
#modal .mi { width: 52px; height: 52px; border-radius: 26px; display: grid; place-items: center; background: #e87a7a26; color: var(--red); margin-bottom: 4px; }
#modal .mi .ic { width: 22px; height: 22px; }
#modal .mt { font-size: 15px; font-weight: 600; font-family: Outfit, sans-serif; }
#modal .ms { font-size: 12.5px; color: var(--dim); text-align: center; line-height: 1.5; }
#modal .mb { display: flex; gap: 8px; width: 100%; margin-top: 10px; }
#modal .mb button { flex: 1; height: 38px; border-radius: 19px; font-size: 13px; font-weight: 600; color: #c9c9d1; }
#modal .mb button:hover { background: var(--lit); }
#modal .mb button.red { background: var(--red); color: #1a0606; }

const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
const nextEvent = () => { const d = new Date(); return EVENTS.filter(e => e.s.getTime() + e.m * 60000 > d && e.s - d < 864e5).sort((a, b) => a.s - b.s)[0]; };
const soonShort = ms => { if (ms <= 0) return "Now"; const m = Math.ceil(ms / 60000); return m < 60 ? m + "m" : Math.floor(m / 60) + "h"; };
const soonWords = e => { const ms = e.s - new Date(); if (ms <= 0) return "now"; const m = Math.ceil(ms / 60000); return m < 60 ? "in " + m + " min" : "in " + Math.floor(m / 60) + " h" + (m % 60 ? " " + (m % 60) + " min" : ""); };

/* the frame: the widgets on each edge, in order */
const edges = { top: ["calendar", "song", "claude"], right: ["drives", "net"], bottom: ["apps", "downloads"], left: ["eyes"] };
const horiz = e => e === "top" || e === "bottom";
const st = {};
let PH = null, drag = null, justDragged = false;

function make(id, edge) {
  const wc = document.createElement("div");
  wc.className = "wc";
  wc.innerHTML = '<div class="pk"></div><div class="pb"></div>';
  nadiEl.append(wc);
  const w = st[id] = { id, wc, edge, pk: wc.firstChild, pb: wc.lastChild, peekHtml: "", bodyHtml: "", want: 60, pw: 0, ph: 0,
    rest: { x: new Spring(0), y: new Spring(0), w: new Spring(0), h: new Spring(0) }, fresh: true,
    open: new Spring(0), shown: new Spring(0), swell: new Spring(0), pinned: false, ban: null, glow: null };
  bind(w);
  renderPeek(w, true);
  return w;
}
function renderPeek(w, force) {
  const v = !horiz(w.edge), html = W[w.id].peek(v);
  if (!force && html === w.peekHtml) return false;
  w.peekHtml = html;
  w.pk.innerHTML = html;
  inStep(w.pk);
  meas.className = v ? "vv" : "h";
  meas.innerHTML = html;
  w.want = v ? Math.max(DEPTH_V, meas.offsetHeight + 16) : Math.max(DEPTH_H, meas.offsetWidth);
  return true;
}
function renderBody(w) {
  const d = W[w.id];
  const html = w.ban ? w.ban.html : d.body ? d.body() : "";
  if (html === w.bodyHtml) return false;
  w.bodyHtml = html;
  w.pb.innerHTML = html;
  inStep(w.pb);
  w.pw = w.ban ? BANNER_W : d.w || (horiz(w.edge) ? PANEL_W : PANEL_W_SIDE);
  w.pb.style.width = w.pw + "px";
  const h = w.pb.offsetHeight;
  const changed = h !== w.ph;
  w.ph = h;
  return changed;
}
const isOpen = w => w.open.to === 1;

/* the layout: each edge's widgets in a row (or column) in its middle, a gap between; an open one as big as its panel, pushing the
   others aside; its box with the fillets at its two ends */
function layout(snap) {
  for (const e in edges) {
    const ids = edges[e];
    const along = ids.map(id => id === "PH" ? PH.along : isOpen(st[id]) ? (horiz(e) ? st[id].pw : st[id].ph) : st[id].want);
    const total = along.reduce((a, b) => a + b + 2 * FILLET, 0) + GAP * Math.max(0, ids.length - 1);
    const len = horiz(e) ? SW : SH - TB;
    let p = Math.max(0, (len - total) / 2);
    ids.forEach((id, i) => {
      const slot = along[i] + 2 * FILLET;
      if (id !== "PH") {
        const w = st[id], o = isOpen(w);
        const across = o ? (horiz(e) ? w.ph : w.pw) : (horiz(e) ? DEPTH_H : DEPTH_V);
        let b;
        if (e === "top") b = { x: p, y: 0, w: slot, h: across };
        else if (e === "bottom") b = { x: p, y: SH - TB - across, w: slot, h: across };
        else if (e === "left") b = { x: 0, y: p, w: across, h: slot };
        else b = { x: SW - across, y: p, w: across, h: slot };
        if (horiz(e)) b.x = clamp(b.x, -FILLET, SW - b.w + FILLET);
        else b.y = clamp(b.y, -FILLET, SH - TB - b.h + FILLET);
        for (const k of ["x", "y", "w", "h"]) { w.rest[k].to = b[k]; if (snap || w.fresh) { w.rest[k].now = b[k]; w.rest[k].vel = 0; } }
        w.fresh = false;
      }
      p += slot + GAP;
    });
  }
  kick();
}

/* the shape now (frame.rs shape_now): grown out of its edge while it comes out, swollen under the mouse, round as it opens */
function shapeNow(w) {
  const t = clamp(w.open.now, 0, 1), e = w.edge, h = horiz(e), f = FILLET;
  let b = { x: w.rest.x.now, y: w.rest.y.now, w: w.rest.w.now, h: w.rest.h.now };
  if (w.dragging) return { b, body: b, r: Math.min(b.w, b.h) / 2, t: 0, drop: true };
  const g = Math.max(0, clamp(w.shown.now, -0.1, 1.25));
  if (Math.abs(g - 1) > 0.001) {
    const ak = g, lk = 0.5 + 0.5 * g;
    if (e === "top") { const nw = b.w * lk, nh = b.h * ak; b = { x: b.x + (b.w - nw) / 2, y: b.y, w: nw, h: nh }; }
    else if (e === "bottom") { const nw = b.w * lk, nh = b.h * ak; b = { x: b.x + (b.w - nw) / 2, y: b.y + b.h - nh, w: nw, h: nh }; }
    else if (e === "left") { const nw = b.w * ak, nh = b.h * lk; b = { x: b.x, y: b.y + (b.h - nh) / 2, w: nw, h: nh }; }
    else { const nw = b.w * ak, nh = b.h * lk; b = { x: b.x + b.w - nw, y: b.y + (b.h - nh) / 2, w: nw, h: nh }; }
  }
  const sw = clamp(w.swell.now, -0.3, 1.4) * (1 - t);
  if (Math.abs(sw) > 0.001) {
    const out = SWELL_OUT * sw, al = SWELL_ALONG * sw;
    if (e === "top") b = { x: b.x - al / 2, y: b.y, w: b.w + al, h: b.h + out };

/* the mouse on a widget: it swells; resting there, it opens (on a touch, a tap); leaving, it shuts a moment later, unless pressed */
function bind(w) {
  const wc = w.wc;
  wc.addEventListener("pointerenter", e => {
    if (e.pointerType === "touch" || drag) return;
    clearTimeout(w.leaveT);
    if (!isOpen(w)) { w.swell.to = 1; kick(); }
    if ((W[w.id].body || w.ban) && !isOpen(w)) w.openT = setTimeout(() => open(w.id), HOVER_OPEN);
  });
  wc.addEventListener("pointerleave", e => {
    if (e.pointerType === "touch") return;
    clearTimeout(w.openT);
    w.swell.to = 0; kick();
    if (isOpen(w) && !w.pinned && !w.ban) w.leaveT = setTimeout(() => close(w.id), LEAVE_CLOSE);
  });
  wc.addEventListener("click", e => {
    if (justDragged || e.target.closest("[data-act]")) return;
    clearTimeout(w.openT);
    const d = W[w.id];
    if (d.press) return d.press();
    if (!d.body) return d.poke && d.poke();
    if (w.ban) return;
    if (isOpen(w) && w.pinned && !e.target.closest(".pb")) close(w.id);
    else if (!isOpen(w)) { open(w.id); w.pinned = true; }
    else w.pinned = true;
  });
  wc.addEventListener("contextmenu", e => { e.preventDefault(); widgetMenu(w.id, e); });
  wc.addEventListener("pointerdown", e => { if (e.button === 0 && !e.target.closest(".pb")) { const p = pt(e); drag = { id: w.id, x0: p.x, y0: p.y, on: false }; } });
}
function open(id) {
  const w = st[id];
  if (!w || isOpen(w) || w.shown.to < 1) return;
  for (const k in st) if (k !== id && isOpen(st[k]) && !st[k].ban) close(k);
  hideLauncher();
  W[id].opened && W[id].opened();
  w.bodyHtml = "";
  renderBody(w);
  w.open.to = 1; w.swell.to = 0;
  layout();
}
function close(id) {
  const w = st[id];

  w.open.to = 0; w.pinned = false;

}
function closeAll() { for (const k in st) if (isOpen(st[k]) && !st[k].ban) close(k); }

/* banners: the widget becomes one for a moment (or until answered), its neighbours making room */
function banner(id, html, glow, ms) {

}
function claudeAsk() {
  if (!st.claude || claude.waiting) return;
  claude.waiting = true;
  claude.sessions[1] = { title: "Site", sub: "Edit docs/index.html?", st: "waiting", since: Date.now() };
  renderPeek(st.claude); layout();
  banner("claude", `<div class="ban"><div class="hd"><span class="ct" style="width:40px;height:40px;border-radius:12px;background:${CLAUDE};display:grid;place-items:center;color:#fff">${ic("spark", 20)}</span><div style="flex:1;display:flex;flex-direction:column;gap:3px"><b style="font-size:15px">Site needs you</b><span class="dim" style="font-size:13px">Claude wants to edit docs/index.html</span></div></div><div class="btns"><button class="no" data-act="deny">Deny</button><button style="background:${CLAUDE};color:#1a0d05" data-act="allow">Allow</button></div></div>`, { c: AMBER, breathe: true });
}
function claudeAnswer(ok) {
  claude.waiting = false;
  claude.sessions[1] = ok ? { title: "Site", sub: "Editing docs/index.html", st: "working", since: Date.now() } : { title: "Site", sub: "Stopped", st: "finished", since: Date.now() };
  unbanner("claude");
  renderPeek(st.claude); layout();
  if (ok) setTimeout(() => { claude.sessions[1] = { title: "Site", sub: "Finished", st: "finished", since: Date.now() }; refresh("claude"); }, 9000);

/* dragged to another edge: a drop under the mouse; its new neighbours make room */

  }
  for (const d of drives) { d.r.push(Math.random() < (d.l === "C" ? .45 : .08) ? Math.random() : Math.random() * .03); d.r.shift(); }
  net.down = clamp(net.down + (Math.random() - .5) * 4e6, 6e6, 32e6);
  net.up = clamp(net.up + (Math.random() - .5) * 6e5, 8e5, 4e6);
  for (const k in st) refresh(k);
  const c = $("#clock"); if (c) { const d = new Date(); c.innerHTML = `${span(d)}<br>${d.getMonth() + 1}/${d.getDate()}/${d.getFullYear()}`; }
}

/* the screen: the window's own size; on a phone, a 1280 by 760 one shrunk to fit */
const wrap = $("#wrap");
function fit() {
  const small = innerWidth < 820 || innerHeight < 480;
  document.body.classList.toggle("small", small);
  if (small) { SW = 1280; SH = 760; scale = innerWidth / SW; scr.style.transform = `scale(${scale})`; wrap.style.height = SH * scale + "px"; }
  else { SW = innerWidth; SH = innerHeight; scale = 1; scr.style.transform = "none"; wrap.style.height = SH + "px"; }
  scr.style.width = SW + "px"; scr.style.height = SH + "px";
  DPR = Math.min(2, (window.devicePixelRatio || 1) * scale);
  // (the liquid stops at the taskbar: nothing of it drawn over it)
  cv.width = Math.round(SW * DPR); cv.height = Math.round((SH - TB) * DPR);
  cv.style.width = SW + "px"; cv.style.height = SH - TB + "px";
  if (!prog) for (const k in st) st[k].wc.classList.add("solid");
  layout(true);
}
addEventListener("resize", fit);

/* start */
for (const e in edges) for (const id of edges[e]) make(id, e);
taskbar(); tray();
fit();
if (!prog) for (const k in st) st[k].wc.classList.add("solid");
if (document.fonts) document.fonts.ready.then(() => { for (const k in st) renderPeek(st[k], true); layout(); });
openApp("notepad");
openApp("music");
{ const w = openWins.notepad.el; w.style.left = Math.max(150, SW * .12) + "px"; w.style.top = Math.max(70, SH * .13) + "px"; }
{ const w = openWins.music.el; w.style.left = clamp(SW * .56, 600, SW - 480) + "px"; w.style.top = Math.max(90, SH * .2) + "px"; }
focusWin("notepad");
setTimeout(comeOut, 400);
setInterval(tick, 1000);
setTimeout(claudeAsk, 14000);
</script>
