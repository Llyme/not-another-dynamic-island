<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NADI</title>
<meta name="description" content="Widgets that live on the edges of your Windows screen. Try them on a pretend PC: hover, open, drag and play with everything.">
<meta name="theme-color" content="#000000">
<meta property="og:title" content="NADI: Not Another Dynamic Island">
<meta property="og:description" content="Widgets on the edges of your Windows screen. Try them on a pretend PC.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* The page is a pretend Windows screen with NADI running on it, set up the way it is used: no Windows taskbar (NADI's dock, tray
   and clock in its place), widgets in the corners and along the edges, merged into them or floating just off them. NADI's part is
   drawn the way the app draws it: its widgets are one liquid (the app's own shader, in WebGL), sized and sprung with the app's own
   numbers; what is in them is drawn over the liquid. */
:root {
  color-scheme: dark;
  --acc: #5ac88c;
  --two: #e8b04a;
  --claude: #d97757;
  --red: #e87a7a;
  --teal: #5ac8e6;
  --blue: #4f8ff0;
  --text: #f2f2f5;
  --dim: #9a9aa4;
  --track: #1b1b20;
  --lit: #26262b;
  --tile: #161619;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #000; color: var(--text); font-family: Inter, "Segoe UI", system-ui, sans-serif; font-size: 12.5px; }
body { overflow: hidden; }
body.small { overflow: auto; height: auto; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: default; }
a { color: inherit; }
#wrap { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
#screen { position: absolute; left: 0; top: 0; width: 100vw; height: 100vh; overflow: hidden; transform-origin: 0 0; user-select: none; -webkit-user-select: none; touch-action: none; }
body.small #screen { touch-action: pan-y; }
.ic { display: inline-block; flex: none; }
.ic svg { display: block; width: 100%; height: 100%; }
.tab { font-variant-numeric: tabular-nums; }
.out { font-family: Outfit, Inter, sans-serif; }
#wall { position: absolute; inset: 0; background:
  radial-gradient(42% 52% at 68% 56%, #8fb6ff 0%, #5d8ff0 22%, transparent 60%),
  radial-gradient(60% 70% at 74% 62%, #2f5fd0 0%, transparent 65%),
  radial-gradient(50% 60% at 30% 90%, #3a2a8a 0%, transparent 70%),
  radial-gradient(70% 80% at 12% 6%, #142456 0%, transparent 70%),
  linear-gradient(160deg, #0b1534, #13275c 55%, #091128); }
#icons { position: absolute; left: 56px; top: 30px; display: flex; flex-direction: column; gap: 6px; z-index: 2; }
.dk { width: 84px; padding: 8px 4px 6px; border-radius: 6px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11.5px; color: #fff; text-shadow: 0 1px 3px #000c; text-align: center; line-height: 1.25; }
.dk:hover { background: #ffffff1a; }
.dk .ib { width: 44px; height: 44px; border-radius: 11px; display: grid; place-items: center; box-shadow: 0 6px 16px #0006; color: #fff; }
.dk .ib .ic { width: 22px; height: 22px; }

/* windows */
#wins { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
.win { position: absolute; pointer-events: auto; display: flex; flex-direction: column; background: #1e1f25f2; border: 1px solid #ffffff16; border-radius: 9px; box-shadow: 0 24px 60px #0009, 0 2px 8px #0005; overflow: hidden; transition: opacity .18s, transform .22s cubic-bezier(.2,.9,.3,1); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); }
.win.gone { opacity: 0; transform: translateY(16px) scale(.96); pointer-events: none; }
.wbar { height: 34px; flex: none; display: flex; align-items: center; padding-left: 12px; gap: 9px; font-size: 12px; color: #d6d6dc; }
.wbar .ic { width: 15px; height: 15px; }
.wbar .sp { flex: 1; }
.wbar button { width: 44px; height: 34px; display: grid; place-items: center; color: #c9c9d1; }
.wbar button .ic { width: 13px; height: 13px; }
.wbar button:hover { background: #ffffff14; }
.wbar button.cl:hover { background: #c42b1c; color: #fff; }
.wbody { flex: 1; min-height: 0; overflow: auto; }
.wbody::-webkit-scrollbar { width: 10px; }
.wbody::-webkit-scrollbar-thumb { background: #ffffff22; border-radius: 5px; border: 3px solid transparent; background-clip: padding-box; }

/* NADI: the liquid under, what is in each widget over it */
#dim { position: absolute; inset: 0; z-index: 45; background: #05050a59; display: none; animation: fade .25s; }
#dim.show { display: block; }
#nadi { position: absolute; inset: 0; z-index: 50; pointer-events: none; }
#liquid { position: absolute; left: 0; top: 0; }
.wc { position: absolute; pointer-events: auto; overflow: hidden; }
.wc.solid { background: #000; }
.wc.idle .pk { opacity: .45 !important; }
.pk { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; white-space: nowrap; font-weight: 600; font-size: 12.5px; }
.pz { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 12px; }
.v .pz { flex-direction: column; padding: 8px 0; gap: 6px; }
.sq .pz { padding: 0; }
.pb { position: absolute; left: 0; top: 0; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.a-b .pb { top: auto; bottom: 0; }
.a-r .pb { left: auto; right: 0; }
#meas { position: absolute; left: -9999px; top: 0; visibility: hidden; display: inline-flex; white-space: nowrap; font-weight: 600; font-size: 12.5px; }
#meas.v { width: 40px; }
.dim { color: var(--dim); font-weight: 500; }
.page { width: 24px; height: 26px; border-radius: 6px; background: #26262b; position: relative; overflow: hidden; flex: none; }
.page i { position: absolute; left: 0; right: 0; top: 0; height: 8px; font-style: normal; font-size: 5.5px; font-weight: 700; color: #04130b; text-align: center; line-height: 8px; }
.page b { position: absolute; left: 0; right: 0; bottom: 2px; text-align: center; font-size: 12px; font-weight: 700; font-family: Outfit, sans-serif; }
.pdot { width: 6px; height: 6px; border-radius: 3px; background: var(--acc); flex: none; }
.pdot.pulse { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.5); opacity: .55; } }
.clock2 { display: flex; flex-direction: column; align-items: center; line-height: 1.15; padding: 0 4px; }
.clock2 b { font-size: 15px; font-weight: 600; }
.clock2 small { font-size: 11px; color: var(--dim); font-weight: 500; }
.viz { display: flex; gap: 2px; align-items: center; height: 14px; }
.viz i { display: block; width: 3px; height: 6px; border-radius: 2px; background: currentColor; animation: viz .9s ease-in-out infinite alternate; }
.viz i:nth-child(2) { animation-duration: .7s; }
.viz i:nth-child(3) { animation-duration: 1.1s; }
.viz i:nth-child(4) { animation-duration: .8s; }
.viz.still i { animation: none; height: 4px; opacity: .5; }
@keyframes viz { to { height: 14px; } }
.flow { display: inline-block; width: 8px; height: 12px; overflow: hidden; -webkit-mask: linear-gradient(transparent, #000 30%, #000 70%, transparent); mask: linear-gradient(transparent, #000 30%, #000 70%, transparent); vertical-align: -1px; flex: none; }
.flow svg { display: block; width: 8px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.flow.dn svg { animation: fdn .625s linear infinite; }
.flow.up svg { animation: fup .625s linear infinite; }
@keyframes fdn { from { transform: translateY(-12px); } to { transform: translateY(-6px); } }
@keyframes fup { from { transform: translateY(-6px); } to { transform: translateY(-12px); } }
.eyes { display: flex; gap: 9px; align-items: center; --ex: 0px; --ey: 0px; }
.v .eyes { flex-direction: column; gap: 17px; }
.eyes i { display: block; width: 14px; height: 15px; border-radius: 8px; background: #fff; transform: translate(var(--ex), var(--ey)); transition: transform .12s, height .09s; }
.v .eyes i { width: 15px; height: 12px; }
.eyes.blink i { height: 2px !important; }
.eyes.happy i { height: 6px !important; border-radius: 8px 8px 2px 2px; }
/* the dock */
.dock { display: flex; align-items: center; gap: 10px; height: 100%; }
.dapp { display: flex; align-items: center; gap: 6px; height: 48px; padding: 0 4px; border-radius: 14px; }
.dapp:hover { background: #ffffff10; }
.dapp .ti { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: #fff; flex: none; }
.dapp .ti .ic { width: 20px; height: 20px; }
.dapp .use { display: flex; gap: 2px; align-items: flex-end; height: 16px; }
.dapp .use i { width: 3px; border-radius: 2px; min-height: 2px; }
.dapp .nm { display: flex; flex-direction: column; line-height: 1.2; max-width: 96px; overflow: hidden; }
.dapp .nm b { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; }
.dapp .nm small { font-size: 11px; color: var(--dim); font-weight: 500; white-space: nowrap; overflow: hidden; }
.dapp.front { background: #ffffff0d; }
.trayi { display: flex; align-items: center; gap: 10px; }
.trayi .ic { width: 16px; height: 16px; }
.meters { display: flex; flex-direction: column; gap: 3px; width: 34px; }
.meters i { height: 3px; border-radius: 2px; background: #2c2c33; overflow: hidden; display: block; }
.meters i b { display: block; height: 100%; border-radius: 2px; }

/* panels: the app's blocks */
.gb { height: 32px; min-width: 32px; padding: 0 10px; border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: #c9c9d1; }
.gb:hover { background: var(--lit); }
.card { background: var(--track); border-radius: 18px; padding: 14px 16px; display: flex; gap: 14px; align-items: center; }
.lab { font-size: 12px; font-weight: 600; color: var(--dim); }
.row { text-align: left; display: flex; align-items: center; gap: 12px; min-height: 30px; padding: 0 8px; margin: 0 -8px; width: calc(100% + 16px); border-radius: 10px; }
.row.go:hover { background: var(--lit); }
.row .tx { flex: 1; min-width: 0; font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; }
.row .mk { display: flex; gap: 8px; color: var(--dim); }
.row .mk .ic { width: 12px; height: 12px; }
.toggles { display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: var(--track); }
.toggles button { flex: 1; height: 32px; border-radius: 11px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13.5px; font-weight: 600; color: var(--dim); }
.toggles button:hover { background: var(--lit); }
.toggles button.on { background: #24242a; color: var(--text); }
.toggles button.on .ic { color: var(--acc); }
.toggles .ic { width: 16px; height: 16px; }
.bar { height: 4px; border-radius: 2px; background: #26262b; overflow: hidden; position: relative; }
.bar > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: var(--c, var(--acc)); }
.ghost { width: 30px; height: 30px; border-radius: 15px; display: grid; place-items: center; color: #b4b4bc; flex: none; }
.ghost:hover { background: var(--lit); }
.ghost .ic { width: 15px; height: 15px; }
.dayhead { display: flex; align-items: center; }
.dayhead .big { font-family: Outfit, sans-serif; font-size: 36px; font-weight: 600; line-height: 1; letter-spacing: -.3px; }
.dayhead .big small { font-size: 15px; color: var(--dim); margin-left: 5px; font-weight: 500; }
.dayhead .dr { margin-left: auto; text-align: right; display: flex; flex-direction: column; gap: 3px; }
.dayhead .dr span { font-size: 13px; color: var(--dim); }
.dayhead .dr b { font-size: 14px; font-weight: 600; }
.week { display: flex; align-items: center; }
.week .ghost { color: var(--dim); }
.week .days { flex: 1; display: grid; grid-template-columns: repeat(7, 1fr); }
.week .d { height: 60px; margin: 0 2px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
.week .d:hover { background: var(--lit); }
.week .d small { font-size: 10.5px; color: var(--dim); font-weight: 600; }
.week .d b { font-size: 17px; font-family: Outfit, sans-serif; font-weight: 600; }
.week .d.today b { color: var(--acc); }
.week .d.on { background: #f2f2f5; }
.week .d.on small, .week .d.on b { color: #000; }
.week .ds { display: flex; gap: 2px; height: 4px; }
.week .ds i { width: 4px; height: 4px; border-radius: 2px; background: var(--acc); }
.tl { display: flex; flex-direction: column; gap: 8px; }
.tl .ev { display: flex; gap: 12px; }
.tl .tm { width: 40px; text-align: right; font-size: 12.5px; color: var(--dim); padding-top: 9px; flex: none; }
.tl .bx { flex: 1; border-radius: 8px; background: #5ac88c12; position: relative; padding: 9px 12px 9px 14px; display: flex; flex-direction: column; gap: 3px; }
.tl .bx::before { content: ""; position: absolute; left: 0; top: 4px; bottom: 4px; width: 3px; border-radius: 2px; background: var(--acc); }
.tl .bx b { font-size: 14px; font-weight: 600; }
.tl .bx span { font-size: 13px; color: var(--dim); }
.tl .ev.past { opacity: .45; }
.tl .now { height: 2px; background: var(--red); margin-left: 52px; position: relative; border-radius: 1px; }
.tl .now::before { content: ""; position: absolute; left: -3px; top: -3px; width: 8px; height: 8px; border-radius: 4px; background: var(--red); }
.join { height: 36px; padding: 0 14px; border-radius: 18px; background: var(--acc); color: #04130b; display: inline-flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 600; flex: none; }
.join .ic { width: 12px; height: 12px; }
.drv { display: flex; gap: 14px; align-items: center; border-radius: 12px; padding: 6px 8px; margin: -6px -8px; text-align: left; width: calc(100% + 16px); }
.drv:hover { background: #ffffff08; }
.drv .tile { width: 46px; height: 46px; border-radius: 12px; background: #26262b; position: relative; overflow: hidden; display: grid; place-items: center; flex: none; }
.drv .tile b { position: relative; font-family: Outfit, sans-serif; font-size: 22px; font-weight: 600; }
.drv .tile svg { position: absolute; left: 0; bottom: 0; width: 92px; height: 100%; animation: wave 2.4s linear infinite; }
@keyframes wave { to { transform: translateX(-46px); } }
.drv .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.drv .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.drv .top .tt { font-size: 15px; font-weight: 600; }
.drv .top .sz { font-size: 13px; color: var(--dim); }
.drv .top .sz b { color: var(--text); font-weight: 600; }
.drv .graph { display: flex; align-items: center; gap: 8px; height: 20px; }
.drv .graph svg { flex: 1; height: 20px; }
.drv .graph span { font-size: 13px; font-weight: 600; color: var(--blue); white-space: nowrap; }
.xfer { display: flex; flex-direction: column; gap: 10px; }
.xfer .hd { display: flex; align-items: center; gap: 12px; }
.xfer .ti { width: 32px; height: 32px; border-radius: 9px; background: var(--track); display: grid; place-items: center; color: #b4b4bc; flex: none; }
.xfer .ti .ic { width: 16px; height: 16px; }
.xfer .nm { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.xfer .nm b { font-size: 14px; font-weight: 600; }
.xfer .nm span { font-size: 12.5px; color: var(--dim); }
.xfer .rt { font-size: 14px; font-weight: 600; }
.done { display: flex; align-items: center; gap: 12px; height: 34px; }
.done .ok { width: 18px; height: 18px; color: var(--acc); }
.done .nm { flex: 1; font-size: 14px; }
.cover { border-radius: 16px; margin: 0 auto; display: grid; place-items: center; color: #ffffffcc; }
.songhead { display: flex; align-items: center; gap: 10px; }
.songhead .nm { flex: 1; min-width: 0; }
.songhead b { display: block; font-family: Outfit, sans-serif; font-size: 18px; font-weight: 600; }
.songhead span { font-size: 14px; color: var(--dim); }
.seek .bar { height: 5px; border-radius: 3px; }
.seek .bar > i { background: #f2f2f5; }
.seek .tm { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--dim); margin-top: 7px; }
.ctl { display: flex; align-items: center; justify-content: center; gap: 22px; }
.ctl .ghost { width: 44px; height: 44px; border-radius: 22px; color: #f2f2f5; }
.ctl .ghost .ic { width: 20px; height: 20px; }
.ctl .main { width: 52px; height: 52px; border-radius: 26px; background: #f2f2f5; color: #000; display: grid; place-items: center; }
.ctl .main .ic { width: 22px; height: 22px; }
.sec { display: flex; flex-direction: column; gap: 10px; }
.sec .hd { display: flex; align-items: center; gap: 12px; }
.ct { width: 34px; height: 34px; border-radius: 10px; background: var(--claude); color: #fff; display: grid; place-items: center; font-family: Outfit, sans-serif; font-weight: 600; font-size: 16px; flex: none; }
.sec .nm { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.sec .nm b { font-size: 14px; font-weight: 600; }
.sec .nm span { font-size: 12.5px; color: var(--dim); }
.strip { border-radius: 10px; padding: 8px 12px; display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 600; }
.ban { display: flex; flex-direction: column; gap: 12px; }
.ban .hd { display: flex; align-items: center; gap: 12px; }
.ban .btns { display: flex; gap: 8px; }
.ban .btns button { flex: 1; height: 36px; border-radius: 18px; font-size: 13.5px; font-weight: 600; }
.ban .btns .no { color: #c9c9d1; }
.ban .btns .no:hover { background: var(--lit); }
.note { display: flex; gap: 12px; align-items: flex-start; }
.note .ti { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: #fff; flex: none; }
.note .ti .ic { width: 17px; height: 17px; }
.note .nm { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.note .nm b { font-size: 14px; font-weight: 600; }
.note .nm span { font-size: 13px; color: var(--dim); line-height: 1.4; }
.note .when { font-size: 11.5px; color: var(--dim); }
.slider { width: 100%; height: 6px; border-radius: 3px; background: #26262b; position: relative; }
.slider i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: #f2f2f5; }
.slider b { position: absolute; top: 50%; width: 16px; height: 16px; border-radius: 8px; background: #fff; transform: translate(-50%, -50%); }

/* the widget menu (menu.rs) */
#menu { position: absolute; z-index: 70; width: 240px; background: #000; border-radius: 20px; padding: 12px; display: none; flex-direction: column; gap: 8px; animation: grow .2s cubic-bezier(.3,1.3,.5,1); }
#menu.show { display: flex; }
#menu.mini { width: 170px; padding: 6px; gap: 2px; }
@keyframes grow { from { transform: scale(.88); opacity: 0; } }
.segs { display: flex; gap: 6px; }
.seg { flex: 1; height: 30px; border-radius: 10px; background: #17171a; display: flex; }
.seg button { flex: 1; margin: 3px; border-radius: 7.5px; display: grid; place-items: center; color: var(--dim); }
.seg button:hover { background: #26262b; }
.seg button.on { background: #38383f; color: var(--text); }
.map { position: relative; height: 82px; margin: 0 4px; border: 1.5px solid #424249; border-radius: 9px; }
.map button { position: absolute; }
.map i { position: absolute; background: #4d4d54; border-radius: 2px; }
.map button:hover i { background: #9e9ea8; }
.map button.on i { background: var(--acc); }
.togs { display: flex; justify-content: space-between; }
.togs button, .mfoot button { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; position: relative; color: var(--text); }
.mfoot button { height: 30px; }
.togs button:hover, .mfoot button:hover { background: #26262b; }
.togs button.on { color: var(--acc); }
.togs button.on::after { content: ""; position: absolute; bottom: 1px; left: 50%; width: 3.6px; height: 3.6px; margin-left: -1.8px; border-radius: 2px; background: var(--acc); }
.togs .ic, .mfoot .ic { width: 16px; height: 16px; }
.rule { height: 1px; background: #26262b; }
.mfoot { display: flex; gap: 4px; }
.mrow { height: 32px; padding: 0 12px; border-radius: 10px; display: flex; align-items: center; gap: 10px; font-size: 12px; text-align: left; }
.mrow:hover { background: #ffffff14; }
.mrow .ic { width: 14px; height: 14px; }

/* Edit Mode's tray (frame/edit.rs) */
#etray { position: absolute; z-index: 55; width: 300px; background: #000; border-radius: 20px; padding: 14px; display: none; flex-wrap: wrap; gap: 8px; animation: grow .25s cubic-bezier(.3,1.3,.5,1); }
#etray.show { display: flex; }
#etray.over { background: #141416; }
#etray.empty { width: 120px; height: 56px; }
.chip { height: 28px; padding: 0 12px; border-radius: 14px; background: #ffffff24; font-size: 11.5px; font-weight: 600; display: inline-flex; align-items: center; }
.chip.off { background: #ffffff14; color: var(--dim); }

/* the launcher */
#launch { position: absolute; z-index: 60; width: 460px; background: #000; border-radius: 26px; padding: 20px; display: flex; flex-direction: column; gap: 14px; opacity: 0; transform: translateY(14px) scale(.94); pointer-events: none; transition: opacity .16s, transform .32s cubic-bezier(.3,1.3,.5,1); }
#launch.show { opacity: 1; transform: none; pointer-events: auto; }
.search { height: 42px; border-radius: 21px; background: #121214; display: flex; align-items: center; gap: 12px; padding: 0 5px 0 16px; }
.search > .ic { width: 15px; height: 15px; color: var(--dim); }
.search input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--text); font: inherit; font-size: 13.5px; caret-color: var(--acc); }
.search .all { width: 30px; height: 30px; border-radius: 15px; background: #26262b; display: grid; place-items: center; color: #c9c9d1; }
.search .all .ic { width: 13px; height: 13px; }
.pins { display: grid; grid-template-columns: repeat(6, 1fr); row-gap: 4px; }
.pin { height: 78px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; font-size: 12px; color: #e4e4ea; min-width: 0; padding: 0 2px; }
.pin:hover { background: #ffffff0d; }
.pin > span:last-child { max-width: 100%; overflow: hidden; white-space: nowrap; }
.tile36 { width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; color: #fff; flex: none; background: var(--tile); }
.tile36 .ic { width: 16px; height: 16px; }
.foot { display: flex; justify-content: center; gap: 12px; border-top: 1px solid #ffffff14; padding-top: 12px; }
.foot button { width: 36px; height: 36px; border-radius: 18px; display: grid; place-items: center; color: #b4b4bc; }
.foot button.red { color: var(--red); }
.foot button:hover { background: var(--lit); }
.foot .ic { width: 16px; height: 16px; }
.list { display: flex; flex-direction: column; max-height: 330px; overflow: auto; }
.list .row { margin: 0; width: 100%; min-height: 44px; }
.list .row .tx { font-size: 13.5px; }

#tip { position: absolute; z-index: 100; background: #000; color: var(--text); border-radius: 12px; padding: 8px 12px; font-size: 12.5px; white-space: pre-line; max-width: 260px; line-height: 1.45; opacity: 0; transition: opacity .14s; pointer-events: none; }
#tip.show { opacity: 1; }
#modal { position: absolute; inset: 0; z-index: 80; display: none; place-items: center; }
#modal.show { display: grid; }
#modal .dim2 { position: absolute; inset: 0; background: #0008; animation: fade .25s; }
@keyframes fade { from { opacity: 0; } }
#modal .card2 { position: relative; width: 300px; background: #000; border-radius: 26px; padding: 22px 20px 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; animation: pop .34s cubic-bezier(.3,1.3,.5,1); }
@keyframes pop { from { transform: scale(.6); opacity: 0; } }
#modal .mi { width: 52px; height: 52px; border-radius: 26px; display: grid; place-items: center; background: #e87a7a26; color: var(--red); margin-bottom: 4px; }
#modal .mi .ic { width: 22px; height: 22px; }
#modal .mt { font-size: 15px; font-weight: 600; font-family: Outfit, sans-serif; }
#modal .ms { font-size: 12.5px; color: var(--dim); text-align: center; line-height: 1.5; }
#modal .mb { display: flex; gap: 8px; width: 100%; margin-top: 10px; }
#modal .mb button { flex: 1; height: 38px; border-radius: 19px; font-size: 13px; font-weight: 600; color: #c9c9d1; }
#modal .mb button:hover { background: var(--lit); }
#modal .mb button.red { background: var(--red); color: #1a0606; }
#over { position: absolute; inset: 0; z-index: 90; display: none; }
#over.show { display: block; }
#over.black { background: #000; animation: fade .6s; }
#over.lock { animation: fade .4s; }
#over .lk { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding-top: 16vh; color: #fff; text-shadow: 0 2px 20px #0006; }
#over .lk .big { font-family: Outfit, sans-serif; font-size: 96px; font-weight: 600; line-height: 1; }
#over .lk .sm { font-size: 18px; margin-top: 10px; }
#over .lk .hint { position: absolute; bottom: 8vh; font-size: 13px; opacity: .7; }
#over .off { position: absolute; inset: 0; display: grid; place-items: center; }
#over .off button { width: 64px; height: 64px; border-radius: 32px; display: grid; place-items: center; color: #444; }
#over .off button:hover { color: var(--acc); background: #ffffff08; }
#over .off .ic { width: 28px; height: 28px; }
#over.leaving { animation: up .5s cubic-bezier(.2,.9,.3,1) forwards; }
@keyframes up { to { transform: translateY(-100%); } }
#over.waking { animation: fadeout .7s forwards; }
@keyframes fadeout { to { opacity: 0; } }

.readme { padding: 14px 18px 18px; font-size: 13px; line-height: 1.65; color: #e4e4ea; user-select: text; -webkit-user-select: text; }
.readme h1 { font-family: Outfit, sans-serif; font-size: 22px; font-weight: 600; margin: 2px 0; }
.readme .sub { color: var(--dim); margin-bottom: 12px; }
.readme ul { margin: 0 0 14px; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 7px; }
.readme li { display: flex; gap: 10px; align-items: flex-start; }
.readme li .ic { width: 16px; height: 16px; color: var(--acc); margin-top: 3px; }
.readme .get { display: flex; gap: 8px; margin-top: 4px; }
.readme a { text-decoration: none; }
.sb { height: 34px; padding: 0 16px; border-radius: 17px; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 7px; }
.sb .ic { width: 15px; height: 15px; }
.sb.acc { background: var(--acc); color: #04130b; }
.sb.acc:hover { background: #6fd89e; }
.sb.gh2 { color: #d6d6dc; }
.sb.gh2:hover { background: var(--lit); }
.player { padding: 8px 20px 18px; display: flex; flex-direction: column; gap: 14px; }
.player .ctl .ghost { color: #d6d6dc; }
.trk { display: flex; flex-direction: column; gap: 2px; }
.trk .row { margin: 0; width: 100%; min-height: 44px; }
.trk .row .tx { font-size: 13px; display: flex; flex-direction: column; gap: 2px; }
.trk .row .tx span { font-size: 11.5px; color: var(--dim); font-weight: 500; }
.trk .row.now .tx { color: var(--acc); }
.plug { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; }
.plug:hover { background: #ffffff08; }
.plug .ib { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; color: #fff; flex: none; }
.plug .ib .ic { width: 18px; height: 18px; }
.plug .tx { flex: 1; min-width: 0; }
.plug .tt { font-weight: 600; font-size: 13px; }
.plug .ts { color: var(--dim); font-size: 12px; line-height: 1.5; margin-top: 2px; }
.plug .sb { height: 30px; padding: 0 14px; flex: none; }
.plug .added { color: var(--acc); width: 30px; height: 30px; display: grid; place-items: center; }
.pretend { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: var(--dim); }
.pretend .ib { width: 64px; height: 64px; border-radius: 16px; display: grid; place-items: center; color: #fff; }
.pretend .ib .ic { width: 30px; height: 30px; }
#below { display: none; padding: 26px 20px 40px; text-align: center; }
body.small #below { display: block; }
#below h1 { font-family: Outfit, sans-serif; font-size: 26px; margin: 0 0 6px; }
#below p { color: var(--dim); margin: 0 0 18px; line-height: 1.55; }
#below .sb { height: 44px; padding: 0 22px; border-radius: 22px; font-size: 14px; text-decoration: none; }

</head>

function act(a, el, e) {
  const v = el.dataset.v;
  switch (a) {
    case "play": music.playing = !music.playing; syncMusic(); break;
    case "next": music.i = (music.i + 1) % TRACKS.length; music.t = 0; syncMusic(); break;
    case "prev": if (music.t > 4) music.t = 0; else { music.i = (music.i + TRACKS.length - 1) % TRACKS.length; music.t = 0; } syncMusic(); break;
    case "track": music.i = +v; music.t = 0; music.playing = true; syncMusic(); break;
    case "day": cal.sel = +v; refresh("calendar"); break;
    case "week": cal.sel += +v; refresh("calendar"); break;
    case "nudge": case "game": nudge(el); break;
    case "wifi": net.wifi = net.air ? true : !net.wifi; net.air = false; if (!net.wifi) net.hot = false; refresh("net"); break;
    case "air": net.air = !net.air; if (net.air) net.hot = false; refresh("net"); break;
    case "hot": net.hot = !net.hot; refresh("net"); break;
    case "copy": { const c = $("#copied"); if (c) { c.textContent = "Copied"; setTimeout(() => refresh("net"), 1200); } break; }
    case "drive": openApp("files"); break;
    case "clear": dl.done = dl.done.filter(d => d.name !== v); refresh("downloads"); break;
    case "allow": claudeAnswer(true); break;
    case "deny": claudeAnswer(false); break;
    case "app": openApp(v); break;
    case "dock": { const w = openWins[v]; if (!w) openApp(v); else if (w.min || frontWin() !== v) focusWin(v, true); else minWin(v); break; }
    case "allapps": allApps(); break;
    case "power": hideLauncher(); power(v); break;
    case "desk": DESK[+v].run(); break;
    case "addplug": moveTo(v, v === "battery" ? "bottom-right" : v === "eyes" ? "top" : "top"); rerenderWin("plugins"); break;
    case "go": go(v); break;
    default:
      if (a.startsWith("vol:") && e) {
        const r = el.getBoundingClientRect(), f = clamp((e.clientX - r.left) / r.width, 0, 1), k = a.slice(4);

}

const tip = $("#tip");
let tipT = 0, tipFor = null;
function tipText(el) {

    if (x + w > SW - 4 && h >= w) { tx = x - tw - 10; ty = clamp(y + h / 2 - th / 2, 6, SH - th - 6); }

  }, 500);
});
scr.addEventListener("pointerout", e => { if (!e.relatedTarget || !tipFor || !tipFor.contains(e.relatedTarget)) hideTip(); });
function hideTip() { clearTimeout(tipT); tipFor = null; tip.classList.remove("show"); }

addEventListener("pointermove", e => {
  moveDrag(e);
  const p = pt(e), sr = scr.getBoundingClientRect();
  for (const eyes of nadiEl.querySelectorAll(".eyes")) {
    const r = eyes.getBoundingClientRect();
    const cx = (r.left + r.width / 2 - sr.left) / scale, cy = (r.top + r.height / 2 - sr.top) / scale;
    const dx = p.x - cx, dy = p.y - cy, d = Math.hypot(dx, dy) || 1, k = Math.min(1, d / 260);
    eyes.style.setProperty("--ex", (dx / d * 3.5 * k).toFixed(2) + "px");
    eyes.style.setProperty("--ey", (dy / d * 3.5 * k).toFixed(2) + "px");
  }
});
addEventListener("pointerup", endDrag);
scr.addEventListener("pointerdown", e => {
  hideTip();
  if (!e.target.closest("#menu")) hideMenu();
  if (!e.target.closest(".wc")) for (const k in st) if (isOpen(st[k]) && st[k].pinned && !st[k].flags.open) close(k);
  if (!e.target.closest("#launch, .wc")) hideLauncher();
});
scr.addEventListener("contextmenu", e => {
  e.preventDefault();
  if (e.target.closest(".wc, .win, #launch, #menu")) return;
  // (elsewhere: the short menu)
  hideTip(); hideLauncher();
  const p = pt(e);
  menu.className = "show mini";
  menu.innerHTML = [["grid", "Edit Widgets", "edit"], ["get", "Get NADI", "get"], ["code", "GitHub", "gh"]].map(([i, l, k]) => `<button class="mrow" data-mini="${k}">${ic(i, 14)}${l}</button>`).join("");
  menu.style.left = clamp(p.x, 8, SW - 178) + "px"; menu.style.top = clamp(p.y, 8, SH - menu.offsetHeight - 8) + "px";
});
menu.addEventListener("click", e => { const b = e.target.closest("[data-mini]"); if (!b) return; hideMenu(); const k = b.dataset.mini; if (k === "edit") enterEdit(); else if (k === "get") go(GET); else go(REPO); });
addEventListener("keydown", e => { if (e.key === "Escape") { if (editing) leaveEdit(); hideLauncher(); hideMenu(); closeAll(); modal.classList.remove("show"); } });
setInterval(() => { for (const eyes of nadiEl.querySelectorAll(".eyes")) { eyes.classList.add("blink"); setTimeout(() => eyes.classList.remove("blink"), 120); } }, 4300);

/* time goes on: once a second */
function tick() {
  const t = TRACKS[music.i];
  if (music.playing) { music.t += 1; if (music.t >= t.len) { music.i = (music.i + 1) % TRACKS.length; music.t = 0; syncMusic(); } }
  const mb = $("#mbar"), mt = $("#mtime");
  if (mb) { mb.style.width = (music.t / TRACKS[music.i].len * 100).toFixed(2) + "%"; mt.textContent = mmss(music.t); }
  dl.rate = clamp(dl.rate + (Math.random() - .5) * 8e5, 2.6e6, 6.4e6);
  dl.hist.push(dl.rate); dl.hist.shift();
  const it = dl.items[0];
  if (it) {
    it.p = Math.min(1, it.p + dl.rate / it.size * 40);
    if (it.p >= 1) {
      dl.items.shift();
      dl.done.unshift({ name: it.name }); dl.done.length = Math.min(dl.done.length, 3);
      if (!isOpen(st.downloads)) banner("downloads", `<div class="ban"><div class="hd">${ic("check", 22, "color:" + ACC)}<div style="flex:1;display:flex;flex-direction:column;gap:3px"><b style="font-size:15px">${it.name}</b><span class="dim" style="font-size:13px">Downloaded</span></div></div></div>`, null, 4500);
      const nx = NEXT_DL.shift(); nx.p = 0; dl.items.push(nx); NEXT_DL.push({ name: it.name, ic: it.ic, size: it.size });
    }
  }
  for (const d of drives) { d.r.push(Math.random() < (d.l === "C" ? .45 : .08) ? Math.random() : Math.random() * .03); d.r.shift(); }
  for (const k in meters) { meters[k].push(clamp(meters[k].at(-1) + (Math.random() - .5) * .12, .05, .95)); meters[k].shift(); }
  net.down = clamp(net.down + (Math.random() - .5) * 4e6, 6e6, 32e6);
  net.up = clamp(net.up + (Math.random() - .5) * 6e5, 8e5, 4e6);
  if (!editing && !drag) for (const k in st) refresh(k);
}

/* the screen: the window's own size; on a phone, a 1280 by 760 one shrunk to fit */
const wrap = $("#wrap");
function fit() {
  const small = innerWidth < 820 || innerHeight < 480;
  document.body.classList.toggle("small", small);
  if (small) { SW = 1280; SH = 760; scale = innerWidth / SW; scr.style.transform = `scale(${scale})`; wrap.style.height = SH * scale + "px"; }
  else { SW = innerWidth; SH = innerHeight; scale = 1; scr.style.transform = "none"; wrap.style.height = SH + "px"; }
  scr.style.width = SW + "px"; scr.style.height = SH + "px";
  DPR = Math.min(2, (window.devicePixelRatio || 1) * scale);
  cv.width = Math.round(SW * DPR); cv.height = Math.round(SH * DPR);
  cv.style.width = SW + "px"; cv.style.height = SH + "px";
  layout(true);
  if (editing) renderTray();
}
addEventListener("resize", fit);

/* start: the widgets come out of their edges, in a wave */
for (const id of Object.keys(W)) make(id);
fit();
if (document.fonts) document.fonts.ready.then(() => { for (const k in st) renderPeek(st[k], true); layout(); });
openApp("notepad");
openApp("music");
{ const w = openWins.notepad.el; w.style.left = Math.max(170, SW * .12) + "px"; w.style.top = Math.max(60, SH * .1) + "px"; }
{ const w = openWins.music.el; w.style.left = clamp(SW * .56, 620, SW - 500) + "px"; w.style.top = Math.max(80, SH * .16) + "px"; }
focusWin("notepad");
setTimeout(comeOut, 400);
setInterval(tick, 1000);
setTimeout(claudeAsk, 14000);
setTimeout(toast, 30000);
</script>
