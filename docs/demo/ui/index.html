<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NADI</title>
    <script src="../shim.js"></script>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="hub.css" />
  </head>
  <body>
    <script>
      // forward uncaught JS errors to the Rust log (surfaced in debug builds)
      window.addEventListener("error", (e) => {
        try { window.__TAURI__.event.emit("js-error", `${e.message} @ ${e.filename}:${e.lineno}:${e.colno}`); } catch (_) {}
      });
      window.addEventListener("unhandledrejection", (e) => {
        try { window.__TAURI__.event.emit("js-error", `unhandled rejection: ${e.reason}`); } catch (_) {}
      });
    </script>
    <!-- the glow that builds at the top edge while the island is being "called" -->
    <div id="call-glow" aria-hidden="true">
      <i class="halo"></i>
      <i class="core"></i>
    </div>
    <canvas id="viz-bleed" aria-hidden="true"></canvas>
    <div id="pill-glow" aria-hidden="true"></div>
    <div id="pill">
      <div id="bg" aria-hidden="true">
        <div class="bg-layer" id="bg-compact"></div>
        <div class="bg-layer" id="bg-hub"></div>
      </div>
      <div id="lock-badge" aria-hidden="true"></div>
      <canvas id="viz"></canvas>
      <canvas id="face"></canvas>
      <div id="notification" class="hidden">
        <div id="notif-icon"></div>
        <div class="text-col">
          <div id="notif-title"></div>
          <div id="notif-body"></div>
        </div>
        <div id="notif-timer"><div></div></div>
      </div>
      <div id="brief" class="hidden">
        <div id="brief-tile" class="llm-tile"></div>
        <div id="brief-title"></div>
        <div id="brief-right" class="llm-right"></div>
      </div>
      <div id="hub" class="hidden">
        <div id="hub-head">
          <canvas id="hub-eyes"></canvas>
          <div id="hub-clock" data-tip="Calendar"><span id="hub-time"></span><span id="hub-date"></span></div>
          <div id="hub-rings">
            <span class="ring-wrap" id="ring-cpu" data-color="#5AC8E6"></span>
            <span class="ring-wrap" id="ring-ram" data-color="#B47EE6"></span>
            <span class="ring-wrap hidden" id="ring-gpu" data-color="#8ADB6E"></span>
          </div>
        </div>
        <div id="hub-body">
          <div id="pane-settings" class="hidden">
            <div id="set-tabs" role="tablist" aria-label="Settings"></div>

            <div class="set-tab hidden" data-tab="general" role="tabpanel">
              <div class="set-title">Startup</div>
              <div class="set-card">
                <label class="set-row">
                  <span class="set-lab">Start with Windows</span>
                  <input class="set-end" type="checkbox" id="set-start-with-windows" />
                </label>
              </div>
              <div class="set-title">Showing the island</div>
              <div class="set-card">
                <label class="set-row">
                  <span class="set-lab tipped" data-tip="Appear under the cursor, not in the middle of the screen">Appear at the cursor</span>
                  <input class="set-end" type="checkbox" id="set-show-at-cursor" />
                </label>
                <label class="set-row">
                  <span class="set-lab tipped" data-tip="Glide along the top edge with the cursor">Follow the cursor</span>
                  <input class="set-end" type="checkbox" id="set-cursor-follow" />
                </label>
                <label class="set-row">
                  <span class="set-lab tipped" data-tip="How long the cursor rests at the edge before the island appears">Hover delay</span>
                  <span class="set-sl">
                    <input type="range" id="set-edge-dwell" data-default="300" min="0" max="1000" step="50" />
                    <span class="set-val" id="set-edge-dwell-label"></span>
                  </span>
                </label>
                <label class="set-row">
                  <span class="set-lab tipped" data-tip="How long before it hides again">Hide delay</span>
                  <span class="set-sl">
                    <input type="range" id="set-idle-hide-delay" data-default="1" min="1" max="15" step="1" />
                    <span class="set-val" id="set-idle-hide-delay-label"></span>
                  </span>
                </label>
                <label class="set-row">
                  <span class="set-lab tipped" data-tip="How long a status stays up">Peek length</span>
                  <span class="set-sl">
                    <input type="range" id="set-peek-duration" data-default="3" min="1" max="15" step="1" />
                    <span class="set-val" id="set-peek-duration-label"></span>
                  </span>
                </label>
                <div class="set-row set-row-auto">
                  <span class="set-lab tipped" data-tip="Stay hidden (and let clicks through) while a fullscreen game or video is in front. The key you pick, held, lifts it for as long as it is down">Hide over full-screen apps</span>
                  <span class="opt-group" id="set-fullscreen-guard" role="group" aria-label="Hide over full-screen apps">
                    <button type="button" data-v="off" aria-pressed="false">Off</button>
                    <button type="button" data-v="alt" aria-pressed="true">Alt</button>
                    <button type="button" data-v="ctrl" aria-pressed="false">Ctrl</button>
                  </span>
                </div>
              </div>
            </div>

            <div class="set-tab hidden" data-tab="size" role="tabpanel">
              <div class="set-title">Preview</div>
              <div class="set-prev" id="size-preview" role="img" aria-label="The island at the top of the screen: the collapsed width, and the wider expanded panel behind it">
                <span class="sp-hub" id="sp-hub"></span>
                <span class="sp-pill" id="sp-pill"></span>
                <span class="sp-cap">Solid: collapsed</span>
                <span class="sp-cap sp-cap-r">Dashed: expanded</span>
              </div>
              <div class="set-title">Dimensions</div>
              <div class="set-card">
                <label class="set-row">
                  <span class="set-lab tipped" data-tip="Width of the collapsed island (the idle and game pills keep their proportions)">Collapsed width</span>
                  <span class="set-sl">
                    <input type="range" id="set-compact-width" data-default="260" min="180" max="560" step="10" />
                    <span class="set-val" id="set-compact-width-label"></span>
                  </span>
                </label>
                <label class="set-row">
                  <span class="set-lab tipped" data-tip="Width of the expanded island">Expanded width</span>
                  <span class="set-sl">
                    <input type="range" id="set-hub-width" data-default="420" min="340" max="640" step="10" />
                    <span class="set-val" id="set-hub-width-label"></span>
                  </span>
                </label>
                <label class="set-row">
                  <span class="set-lab tipped" data-tip="Distance of the island from the top edge of the screen">Distance from the top</span>
                  <span class="set-sl">
                    <input type="range" id="set-top-margin" data-default="4" min="0" max="80" step="2" />
                    <span class="set-val" id="set-top-margin-label"></span>
                  </span>
                </label>
                <label class="set-row">
                  <span class="set-lab tipped" data-tip="How small the island gets while pinned and left alone (100% = never)">Pinned size</span>
                  <span class="set-sl">
                    <input type="range" id="set-pin-shrink" data-default="75" min="40" max="100" step="5" />
                    <span class="set-val" id="set-pin-shrink-label"></span>
                  </span>
                </label>
              </div>
            </div>

            <div class="set-tab hidden" data-tab="look" role="tabpanel">
              <div class="set-title">Appearance</div>
              <div class="set-card">
                <div class="set-row">
                  <span class="set-lab">Accent color</span>
                  <span class="swatches" id="set-accent" role="group" aria-label="Accent color"></span>
                </div>
                <label class="set-row">
                  <span class="set-lab tipped" data-tip="Show the eyes (the sound light stays either way)">Show the eyes</span>
                  <input class="set-end" type="checkbox" id="set-show-eyes" />
                </label>
                <label class="set-row">
                  <span class="set-lab tipped" data-tip="The eyes and the lights move with the sound that plays">React to sound</span>
                  <input class="set-end" type="checkbox" id="set-react-to-audio" />
                </label>
                <label class="set-row">
                  <span class="set-lab tipped" data-tip="Sound light bleeding outside the island: strength and reach (0 = off)">Ambient light</span>
                  <span class="set-sl">
                    <input type="range" id="set-audio-bleed" data-default="60" min="0" max="100" step="5" />
                    <span class="set-val" id="set-audio-bleed-label"></span>
                  </span>
                </label>
                <label class="set-row">
                  <span class="set-lab tipped" data-tip="Glow around a status: strength and reach">Glow</span>
                  <span class="set-sl">
                    <input type="range" id="set-glow" data-default="70" min="0" max="100" step="5" />
                    <span class="set-val" id="set-glow-label"></span>
                  </span>
                </label>
              </div>
              <div class="set-title">Background</div>
              <div class="set-card">
                <div class="set-row">
                  <span class="set-lab tipped" data-tip="Background of the collapsed island">Collapsed island</span>
                  <span class="set-bg">
                    <span class="bg-name" id="bg-name-compact"></span>
                    <button class="set-btn" type="button" id="bg-pick-compact">Choose</button>
                    <button class="set-ibtn hub-btn-x hidden" type="button" id="bg-clear-compact" data-tip="Remove" aria-label="Remove the collapsed background"></button>
                  </span>
                </div>
                <div class="set-row">
                  <span class="set-lab tipped" data-tip="Background of the expanded island">Expanded island</span>
                  <span class="set-bg">
                    <span class="bg-name" id="bg-name-hub"></span>
                    <button class="set-btn" type="button" id="bg-pick-hub">Choose</button>
                    <button class="set-ibtn hub-btn-x hidden" type="button" id="bg-clear-hub" data-tip="Remove" aria-label="Remove the expanded background"></button>
                  </span>
                </div>
                <label class="set-row">
                  <span class="set-lab tipped" data-tip="How dark the background is">Dim the picture</span>
                  <span class="set-sl">
                    <input type="range" id="set-bg-dim" data-default="50" min="0" max="90" step="5" />
                    <span class="set-val" id="set-bg-dim-label"></span>
                  </span>
                </label>
                <div class="hub-row-note" id="bg-error"></div>
              </div>
            </div>

            <div class="set-tab hidden" data-tab="plugins" role="tabpanel">
              <div class="set-card">
                <label class="set-row">
                  <span class="set-lab tipped" data-tip="Only a plugin banner of priority 90 or more rings. The rest waits in the notification list.">Do not disturb</span>
                  <input class="set-end" type="checkbox" id="plugin-dnd" />
                </label>
              </div>
              <div class="set-title set-title-split">
                <span id="plugin-count">Plugins</span>
                <span class="set-tools">
                  <button type="button" class="set-ibtn" id="plugin-folder" data-tip="Open the plugins folder" aria-label="Open the plugins folder"></button>
                  <button type="button" class="set-ibtn" id="plugin-rescan" data-tip="Look for new plugins" aria-label="Look for new plugins"></button>
                </span>
              </div>
              <div class="set-card" id="plugin-list"></div>
            </div>
          </div>

          <div id="pane-info">
            <div id="now-cards" class="flat"></div>
            <div id="notif-history" class="flat"></div>
          </div>

          <div id="pane-calendar" class="hidden">
            <div id="cal-head">
              <button id="cal-prev" aria-label="Previous month"><svg viewBox="0 0 16 16"><path d="M10 3.5 5.5 8l4.5 4.5" /></svg></button>
              <button id="cal-title" data-tip="Jump to Today"></button>
              <button id="cal-next" aria-label="Next month"><svg viewBox="0 0 16 16"><path d="M6 3.5 10.5 8 6 12.5" /></svg></button>
            </div>
            <div id="cal-week"></div>
            <div id="cal-grid"></div>
            <div id="cal-day-title"></div>
            <div id="cal-status" class="notif-history-empty"></div>
            <div id="cal-events" class="flat"></div>
          </div>
        </div>
      </div>
    </div>
    <div id="float-layer"></div>
    <script type="module" src="main.js"></script>
  </body>
</html>
